<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ClearSplit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
<style>
/* Soft UI Evolution × Personal Finance palette (trust blue + profit green) × DM Sans */
:root{
  --bg:#F2F5FA; --surface:#FFFFFF; --surface2:#F7F9FC; --surface3:#EDF1F8;
  --ink:#101B33; --sub:#48566F; --faint:#6E7D96; --disabled:#A6B2C6;
  --line:#E5EAF3; --line2:#D3DCEA;
  --primary:#1E40AF; --primary-hi:#3B82F6; --on-primary:#FFFFFF;
  --prim-soft:#E8EEFC; --prim-line:#C6D4F5;
  --green:#059669; --green-deep:#047857; --green-soft:#E4F5EE;
  --neg:#B42318; --neg-soft:#FBEDEB;
  --ring:#1E40AF;
  --sh-soft:0 1px 2px rgba(30,64,175,.05),0 2px 4px rgba(16,27,51,.04);
  --sh-card:0 1px 2px rgba(30,64,175,.05),0 10px 26px -10px rgba(30,64,175,.14);
  --sh-float:0 4px 10px rgba(16,27,51,.06),0 20px 44px -14px rgba(30,64,175,.28);
  --r-sm:12px; --r-md:16px; --r-lg:20px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation}
body{background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,-apple-system,sans-serif;
  font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100dvh}
button{font-family:inherit;cursor:pointer;color:inherit}
input{font-family:inherit}
.mono{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px;border-radius:6px}
.app{max-width:480px;margin:0 auto;min-height:100dvh;position:relative;
  padding-bottom:calc(118px + env(safe-area-inset-bottom))}

/* Motion: 200-300ms, calm and purposeful */
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes screenIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes slideL{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
@keyframes popToast{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes drawRing{from{stroke-dashoffset:var(--c)}}
@keyframes think{0%,80%,100%{opacity:.25}40%{opacity:1}}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
#screen.swap{animation:screenIn .3s cubic-bezier(.25,.6,.3,1) both}
.r{animation:rise .3s cubic-bezier(.25,.6,.3,1) both}
.sl{animation:slideL .28s cubic-bezier(.25,.6,.3,1) both}
.r1{animation-delay:.03s}.r2{animation-delay:.06s}.r3{animation-delay:.09s}.r4{animation-delay:.12s}.r5{animation-delay:.15s}
.press{transition:transform .2s cubic-bezier(.25,.6,.3,1),box-shadow .25s ease,background .2s ease,border-color .2s ease,color .2s ease}
.press:active{transform:scale(.97)}
.lift{transition:transform .25s cubic-bezier(.25,.6,.3,1),box-shadow .25s ease}
.lift:hover{transform:translateY(-2px);box-shadow:var(--sh-float)}
.lift:active{transform:translateY(0) scale(.985)}
@media(prefers-reduced-motion:reduce){
  *{animation:none !important;transition:none !important}
}

.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* ── Top bar ── */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(18px + env(safe-area-inset-top)) 20px 12px}
.hello .hi{font-size:19px;font-weight:800;letter-spacing:-.02em}
.hello .sb{font-size:12.5px;color:var(--faint);font-weight:500;margin-top:1px}
.topbtns{display:flex;gap:10px;align-items:center}
.iconbtn{width:44px;height:44px;border-radius:var(--r-sm);background:var(--surface);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;position:relative;color:var(--ink);box-shadow:var(--sh-soft)}
.iconbtn:hover{box-shadow:var(--sh-card)}
.iconbtn .bub{position:absolute;top:-5px;right:-5px;background:var(--green);color:#fff;font-size:10px;font-weight:700;
  min-width:18px;height:18px;border-radius:99px;display:flex;align-items:center;justify-content:center;
  padding:0 5px;border:2.5px solid var(--bg)}
.ava{width:44px;height:44px;border-radius:var(--r-sm);background:linear-gradient(135deg,#3B82F6,#1E40AF);
  display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0;box-shadow:var(--sh-soft)}
.ava .i{width:20px;height:20px}
.backlink{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);
  color:var(--sub);font-size:12.5px;font-weight:700;padding:9px 15px 9px 11px;margin-bottom:14px;
  border-radius:var(--r-sm);box-shadow:var(--sh-soft)}
.backlink:hover{color:var(--ink)}
.backlink .i{width:15px;height:15px;stroke-width:2.2}

.page{padding:6px 20px 0}
h1.title{font-size:27px;font-weight:800;letter-spacing:-.025em;line-height:1.15;margin:2px 0 4px}
.subtitle{font-size:13.5px;color:var(--sub);font-weight:500;margin-bottom:18px}
.subtitle .pos{color:var(--green-deep);font-weight:700}
.sect{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:26px 2px 12px}
.sect h2{font-size:17px;font-weight:700;letter-spacing:-.015em}
.sect .meta{font-size:12px;font-weight:600;color:var(--faint)}

/* ── Gradient feature cards (clean, no texture) ── */
.gcard{position:relative;border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh-card);color:#fff}
.gcard .sheen{position:absolute;inset:0;background:radial-gradient(120% 90% at 85% -10%,rgba(255,255,255,.28),rgba(255,255,255,0) 55%)}
.g-hero{background:linear-gradient(135deg,#2E63E7 0%,#1E40AF 58%,#172E86 100%)}
.g-lisa{background:linear-gradient(135deg,#1E40AF 0%,#173390 55%,#0E5B4A 130%)}
.g-save{background:linear-gradient(135deg,#4B83F2 0%,#1E40AF 100%)}
.g-grow{background:linear-gradient(135deg,#10B981 0%,#047857 100%)}
.g-cut{background:linear-gradient(135deg,#F59E0B 0%,#B45309 100%)}
.g-roth{background:linear-gradient(135deg,#8B5CF6 0%,#6128C9 100%)}
.g-fund{background:linear-gradient(135deg,#0EA5C9 0%,#0E6C86 100%)}
.g-goal{background:linear-gradient(135deg,#EC5F94 0%,#B41E5F 100%)}

/* Hero */
.hero{padding:22px 22px 20px;min-height:196px;display:flex;flex-direction:column;justify-content:flex-end}
.hero .toprow{position:absolute;top:18px;left:22px;right:18px;display:flex;justify-content:space-between;align-items:center}
.hero .eyebrow{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:rgba(255,255,255,.8)}
.hero .freq{font-size:11.5px;font-weight:700;color:#fff;background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.28);border-radius:99px;padding:5px 12px}
.hero .amount{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1;position:relative}
.hero .note{font-size:13px;color:rgba(255,255,255,.85);font-weight:500;margin-top:8px;position:relative}
.hero .note b{color:#8CE8C3;font-weight:700}
.statrow{display:flex;gap:10px;margin-top:12px}
.statrow .st{flex:1;background:var(--surface);border-radius:var(--r-md);
  padding:13px 8px;text-align:center;box-shadow:var(--sh-soft)}
.statrow .v{font-size:15px;font-weight:700;letter-spacing:-.01em}
.statrow .k{font-size:10.5px;font-weight:600;color:var(--faint);margin-top:2px}

/* Learn carousel */
.photorow{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:4px 20px 12px;scroll-snap-type:x mandatory}
.photorow::-webkit-scrollbar{display:none}
.pcard{position:relative;flex:0 0 200px;min-height:128px;border-radius:var(--r-md);overflow:hidden;
  border:none;text-align:left;color:#fff;scroll-snap-align:start;box-shadow:var(--sh-card);
  padding:16px 16px 14px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start}
.pcard .tico{width:34px;height:34px;border-radius:10px;background:rgba(255,255,255,.2);
  border:1px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;position:relative}
.pcard .tico .i{width:17px;height:17px}
.pcard .cap{position:relative}
.pcard .cap .t{font-size:14.5px;font-weight:700;letter-spacing:-.01em;display:block}
.pcard .cap .s{font-size:11.5px;color:rgba(255,255,255,.85);font-weight:500;display:block;margin-top:1px}
.pcard .arr{position:absolute;top:14px;right:14px;color:rgba(255,255,255,.9)}
.pcard .arr .i{width:16px;height:16px;stroke-width:2.2}

/* Lisa banner */
.banner{padding:20px;min-height:128px;display:flex;flex-direction:column;justify-content:flex-end;
  width:100%;border:none;text-align:left}
.banner .t{font-size:19px;font-weight:800;letter-spacing:-.02em;position:relative}
.banner .s{font-size:12.5px;color:rgba(255,255,255,.85);font-weight:500;margin-top:3px;position:relative}
.banner .badgewrap{position:absolute;top:15px;right:15px}
.aibadge{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:#fff;background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:5px 11px}
.aibadge i{width:6px;height:6px;border-radius:99px;background:#5EEAB4;display:inline-block}

/* ── Rows / stacks ── */
.stack{background:var(--surface);border-radius:var(--r-md);overflow:hidden;box-shadow:var(--sh-card)}
.row{display:flex;align-items:center;gap:13px;padding:15px 16px;border-top:1px solid var(--surface3);
  background:transparent;width:100%;text-align:left;color:var(--ink);border-left:none;border-right:none;border-bottom:none;
  transition:background .2s}
button.row{cursor:pointer}
button.row:hover{background:var(--surface2)}
.row:first-child{border-top:none}
.rowico{width:40px;height:40px;border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;flex-shrink:0;
  background:var(--surface3);color:var(--sub)}
.rowico.blu{background:var(--prim-soft);color:var(--primary)}
.rowico.grn{background:var(--green-soft);color:var(--green-deep)}
.rowico .i{width:18px;height:18px}
.row .txt{flex:1;min-width:0}
.row .nm{font-size:14.5px;font-weight:700;display:block;letter-spacing:-.01em}
.row .ds{font-size:12px;color:var(--faint);font-weight:500;display:block;margin-top:1px}
.row .amt{font-size:14px;font-weight:700;color:var(--ink)}
.row .amt.dim{color:var(--faint);font-weight:600}
.row .go{width:30px;height:30px;border-radius:10px;background:var(--surface3);color:var(--sub);
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.row .go .i{width:15px;height:15px;stroke-width:2.2}
.row input.nm{border:none;outline:none;background:none;color:var(--ink);width:100%;font-size:14.5px;font-weight:700;padding:2px 0}

.tick{width:23px;height:23px;border-radius:8px;border:1.5px solid var(--line2);display:flex;align-items:center;
  justify-content:center;flex-shrink:0;color:transparent;background:var(--surface);transition:all .2s cubic-bezier(.25,.6,.3,1)}
.tick .i{width:13px;height:13px;stroke-width:3}
.tick.on{background:var(--primary);border-color:var(--primary);color:#fff}

/* ── Buttons / inputs ── */
.btn{background:var(--primary);color:var(--on-primary);border:none;border-radius:var(--r-sm);
  padding:15px 24px;font-size:14.5px;font-weight:700;box-shadow:0 2px 4px rgba(30,64,175,.24),0 8px 18px -6px rgba(30,64,175,.35);
  letter-spacing:-.01em;transition:background .2s,box-shadow .25s,transform .2s}
.btn:hover{background:#1B3A9E}
.btn.sm{padding:10px 16px;font-size:13px}
.btn.ghost{background:var(--surface);color:var(--sub);border:1px solid var(--line2);box-shadow:var(--sh-soft)}
.btn.ghost:hover{background:var(--surface2);color:var(--ink)}
.btn.danger{background:var(--surface);color:var(--neg);border:1px solid var(--line2);box-shadow:var(--sh-soft)}
.btn.danger:hover{background:var(--neg-soft)}
.field{display:flex;align-items:center;background:var(--surface2);border:1.5px solid var(--line2);
  border-radius:var(--r-sm);padding:15px 17px;transition:border-color .2s,background .2s,box-shadow .2s}
.field:focus-within{border-color:var(--primary);background:var(--surface);box-shadow:0 0 0 4px rgba(30,64,175,.1)}
.field .cur{font-size:21px;font-weight:500;color:var(--faint);margin-right:8px}
.field input{background:none;border:none;outline:none;color:var(--ink);font-size:25px;font-weight:800;width:100%;
  font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.field input::placeholder{color:var(--disabled);font-weight:600}
.smallin{border:1.5px solid var(--line);border-radius:var(--r-sm);padding:11px 13px;font-size:13px;font-weight:600;
  outline:none;background:var(--surface);color:var(--ink);transition:border-color .2s;min-width:0}
.smallin:focus{border-color:var(--primary)}
.smallin::placeholder{color:var(--disabled)}
.pedit{display:flex;align-items:center;background:var(--surface2);border-radius:10px;padding:8px 11px;border:1px solid var(--line)}
.pedit:focus-within{border-color:var(--primary)}
.pedit .cur{font-size:12px;font-weight:600;color:var(--faint);margin-right:2px}
.pedit input{border:none;outline:none;background:none;width:56px;text-align:right;font-size:13.5px;font-weight:700;
  color:var(--ink);font-variant-numeric:tabular-nums}
.rmx{width:32px;height:32px;border-radius:10px;background:transparent;border:1px solid var(--line);color:var(--faint);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s}
.rmx:hover{color:var(--neg);border-color:#EFC9C4;background:var(--neg-soft)}
.rmx .i{width:12px;height:12px;stroke-width:2.4}
.addbar{display:flex;gap:8px;padding:13px 14px;border-top:1px solid var(--surface3);background:var(--surface2)}
.addbar .grow{flex:1;min-width:0}
.addbar .pr{width:92px}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{background:var(--surface);border:1px solid var(--line);color:var(--sub);border-radius:99px;
  padding:9px 16px;font-size:12.5px;font-weight:600;white-space:nowrap;flex-shrink:0;box-shadow:var(--sh-soft);
  transition:all .22s cubic-bezier(.25,.6,.3,1)}
.chip:hover{border-color:var(--line2);color:var(--ink)}
.chip.on{background:var(--primary);color:#fff;border-color:var(--primary);font-weight:700}
.searchbar{display:flex;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);
  border-radius:var(--r-sm);padding:12px 15px;margin-bottom:12px;color:var(--faint);box-shadow:var(--sh-soft);
  transition:border-color .2s,box-shadow .2s}
.searchbar:focus-within{border-color:var(--primary);box-shadow:0 0 0 4px rgba(30,64,175,.1)}
.searchbar .i{width:17px;height:17px}
.searchbar input{border:none;outline:none;background:none;font-size:14px;font-weight:500;flex:1;color:var(--ink)}
.searchbar input::placeholder{color:var(--disabled)}

/* ── Wizard ── */
.wiz{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--sh-card);overflow:hidden}
.wiz .pad{padding:22px}
.wiz .bar-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.steptag{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--primary)}
.xbtn{width:36px;height:36px;border-radius:var(--r-sm);background:var(--surface2);border:1px solid var(--line);
  color:var(--sub);display:flex;align-items:center;justify-content:center}
.xbtn:hover{background:var(--surface3);color:var(--ink)}
.xbtn .i{width:15px;height:15px;stroke-width:2.2}
.progbar{height:5px;background:var(--surface3);border-radius:99px;overflow:hidden;margin-bottom:22px}
.progbar i{display:block;height:100%;background:linear-gradient(90deg,var(--primary-hi),var(--primary));
  border-radius:99px;width:var(--w);transition:width .3s cubic-bezier(.25,.6,.3,1)}
.wiz h2.q{font-size:24px;font-weight:800;letter-spacing:-.025em;line-height:1.2;margin-bottom:6px}
.wiz .qs{font-size:13.5px;color:var(--sub);font-weight:500;margin-bottom:18px}
.lab{display:block;font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
.quickamts{display:flex;gap:8px;margin:14px 0 16px}
.qa{background:var(--surface);border:1px solid var(--line);color:var(--sub);border-radius:var(--r-sm);
  padding:10px 15px;font-size:13px;font-weight:600;box-shadow:var(--sh-soft);transition:all .2s}
.qa:hover{border-color:var(--prim-line);color:var(--primary);background:var(--prim-soft)}
.helper{font-size:12.5px;color:var(--faint);font-weight:500;margin-bottom:18px}
.ctarow{display:flex;gap:10px;margin-top:4px}
.backbtn{width:52px;height:52px;border-radius:var(--r-sm);background:var(--surface);border:1px solid var(--line2);
  color:var(--sub);flex-shrink:0;display:flex;align-items:center;justify-content:center;box-shadow:var(--sh-soft)}
.backbtn:hover{background:var(--surface2);color:var(--ink)}
.ctarow .btn{flex:1;height:52px}

.ringwrap{display:flex;align-items:center;gap:22px;margin-bottom:18px}
.ring{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:11;stroke-linecap:round}
.ring circle.bgc{stroke:var(--surface3)}
.ring circle.val{animation:drawRing .8s cubic-bezier(.25,.6,.3,1) both}
.ringcenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringcenter .n{font-size:16px;font-weight:800;letter-spacing:-.015em}
.ringcenter .k{font-size:9.5px;font-weight:600;color:var(--faint);letter-spacing:.04em;text-transform:uppercase}
.legend{flex:1;min-width:0}
.legend .lg{display:flex;align-items:center;gap:9px;font-size:12.5px;font-weight:500;color:var(--sub);padding:4px 0;min-width:0}
.legend .lg span.lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend .sw{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.legend .lv{margin-left:auto;font-weight:700;color:var(--ink);padding-left:8px}

.slrow{padding:15px 16px;border-top:1px solid var(--surface3)}
.slrow:first-child{border-top:none}
.slrow .t{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.slrow input.nm{border:none;outline:none;background:none;font-size:14px;font-weight:700;flex:1;color:var(--ink);min-width:0}
.slrow .pcttag{font-size:13px;font-weight:800;color:var(--primary);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}
.slrow input[type=range]{width:100%;accent-color:var(--primary);height:26px;cursor:pointer}

/* ── Assistant ── */
.chatpanel{background:var(--surface);border-radius:var(--r-md);box-shadow:var(--sh-card);overflow:hidden}
.chatbox{display:flex;flex-direction:column;gap:4px;max-height:44vh;overflow-y:auto;padding:16px 14px;scrollbar-width:thin}
.msg{max-width:82%;padding:10px 14px;font-size:14px;line-height:1.5;font-weight:500;white-space:pre-wrap;
  animation:rise .25s cubic-bezier(.25,.6,.3,1) both;border-radius:var(--r-md)}
.msg.user{align-self:flex-end;background:var(--primary);color:#fff;border-bottom-right-radius:5px;margin-top:8px}
.msg.user+.msg.user{margin-top:2px}
.msg.lisa{align-self:flex-start;background:var(--surface3);color:var(--ink);border-bottom-left-radius:5px;margin-top:8px}
.msg.lisa+.msg.lisa{margin-top:2px}
.msg.lisa.err{background:var(--neg-soft);color:var(--neg)}
.thinking{display:flex;gap:4px;padding:13px 15px;align-self:flex-start;background:var(--surface3);
  border-radius:var(--r-md);border-bottom-left-radius:5px;margin-top:8px}
.thinking i{width:6px;height:6px;border-radius:99px;background:var(--faint);animation:think 1.2s infinite}
.thinking i:nth-child(2){animation-delay:.2s}
.thinking i:nth-child(3){animation-delay:.4s}
.chatinput{display:flex;gap:8px;align-items:center;padding:10px;border-top:1px solid var(--surface3);background:var(--surface2)}
.chatinput input{flex:1;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-sm);outline:none;
  font-size:14px;font-weight:500;color:var(--ink);padding:12px 15px;min-width:0;transition:border-color .2s,box-shadow .2s}
.chatinput input:focus{border-color:var(--primary);box-shadow:0 0 0 4px rgba(30,64,175,.1)}
.chatinput input::placeholder{color:var(--disabled)}
.sendbtn{width:44px;height:44px;border-radius:var(--r-sm);background:var(--primary);border:none;color:#fff;

.sendbtn:hover{background:#1B3A9E}
.sendbtn .i{width:17px;height:17px;stroke-width:2.4}
.tipcard{background:var(--surface);border-radius:var(--r-md);padding:15px 16px;margin-bottom:10px;box-shadow:var(--sh-card)}
.tipcard .th{display:flex;align-items:center;gap:11px;margin-bottom:6px}
.tipcard .tico{width:34px;height:34px;border-radius:10px;background:var(--green-soft);color:var(--green-deep);

.tipcard .tico .i{width:16px;height:16px}
.tipcard .tn{font-size:14px;font-weight:700;flex:1;min-width:0;letter-spacing:-.01em}
.tipcard .save{font-size:11px;font-weight:700;color:var(--green-deep);background:var(--green-soft);
  border-radius:99px;padding:4px 11px;white-space:nowrap}
.tipcard .td{font-size:13px;color:var(--sub);line-height:1.55;font-weight:500}
.tipcard .td b{color:var(--ink)}
.tipcard.loading .td{background:linear-gradient(90deg,var(--sub) 40%,var(--disabled) 50%,var(--sub) 60%);
  background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:shimmer 1.6s linear infinite}

/* ── History ── */
.hrow{padding:15px 16px;border-top:1px solid var(--surface3)}
.hrow:first-child{border-top:none}
.hrow .t{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.hrow .d{font-size:10.5px;font-weight:700;color:var(--faint);letter-spacing:.06em;text-transform:uppercase}
.hrow .a{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.hrow .tags{display:flex;flex-wrap:wrap;gap:3px 14px;font-size:12px;color:var(--faint);font-weight:500}
.hrow .tags b{color:var(--sub);font-weight:700;font-variant-numeric:tabular-nums}
.empty{padding:30px 20px;text-align:center}
.empty .ds{font-size:13px;color:var(--faint);font-weight:500}

/* ── Floating nav ── */
.bnav{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:80;
  width:calc(100% - 32px);max-width:448px;display:flex;align-items:center;justify-content:space-around;gap:2px;
  background:rgba(255,255,255,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid var(--line);border-radius:var(--r-lg);padding:8px 10px;box-shadow:var(--sh-float)}
.bnav button{flex:1;max-width:84px;height:54px;border-radius:var(--r-sm);background:transparent;border:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--faint);
  transition:background .25s cubic-bezier(.25,.6,.3,1),color .25s,transform .2s}
.bnav button:active{transform:scale(.94)}
.bnav button .nvl{font-size:10px;font-weight:700}
.bnav button.on{background:var(--prim-soft);color:var(--primary)}
.bnav button.cta{background:var(--green);color:#fff;flex:0 0 54px;height:54px;border-radius:var(--r-md);margin:0 4px;
  box-shadow:0 2px 4px rgba(5,150,105,.3),0 8px 18px -6px rgba(5,150,105,.45)}
.bnav button.cta:hover{background:var(--green-deep)}
.bnav button .i{width:21px;height:21px}

.toastbox{position:fixed;top:calc(16px + env(safe-area-inset-top));left:50%;z-index:99;width:max-content;max-width:88vw;transform:translateX(-50%)}

  font-weight:600;box-shadow:var(--sh-float);animation:popToast .25s cubic-bezier(.25,.6,.3,1) both;

 ["netflix","Netflix","Streaming",15.49],["hulu","Hulu","Streaming",9.99],["disney","Disney+","Streaming",9.99],
 ["max","Max (HBO)","Streaming",16.99],["prime","Amazon Prime","Streaming",14.99],["appletv","Apple TV+","Streaming",9.99],

 ["m365","Microsoft 365","Software",9.99],["adobe","Adobe CC","Software",59.99],["chatgpt","ChatGPT Plus","Software",20],
 ["claude","Claude Pro","Software",20],["canva","Canva Pro","Software",14.99],["vpn","VPN","Software",12.99],

 ["coffee","Coffee habit (avg)","Food",60],
 ["nyt","NY Times","News",6.25],["wsj","Wall Street Journal","News",12.99],["duo","Duolingo Super","News",12.99],
 ["costco","Costco (yr ÷ 12)","Other",5.42],["aaa","AAA (yr ÷ 12)","Other",6],["petins","Pet insurance","Other",35],["storage","Storage unit","Other",120]
].map(([id,name,cat,price])=>({id,name,cat,price}));
const CATS=[...new Set(CATALOG.map(s=>s.cat))];

const DEFAULTS={
  subs:{}, customSubs:[],
  bills:[
    {id:"b1",name:"Student loans",price:300},{id:"b2",name:"Car insurance",price:250},
    {id:"b3",name:"Phone",price:85},{id:"b4",name:"Groceries",price:700},{id:"b5",name:"Gas & tolls",price:250}

    {id:"fun",name:"Fun money",pct:20,color:"#6D28D9",icon:"star"}

let D=JSON.parse(JSON.stringify(DEFAULTS));
let screen="home", wizStep=1, preview=null, checkVal="", subSearch="", catFilter="All", ledgerTab="history";
let chat=[], lisaBusy=false, tips=null, tipsBusy=false;

const store={
  async get(k){
    try{if(window.storage){const r=await window.storage.get(k);if(r&&r.value)return r.value;}}catch(e){}
    try{return localStorage.getItem(k);}catch(e){}
    return null;
  },
  async set(k,v){
    try{if(window.storage){await window.storage.set(k,v);return;}}catch(e){}
    try{localStorage.setItem(k,v);}catch(e){}
  }
};
async function load(){
  try{
    const v=await store.get("clearsplit-v6");
    if(v){D=Object.assign(JSON.parse(JSON.stringify(DEFAULTS)),JSON.parse(v));}
  }catch(e){}
  D.rules.forEach((r,i)=>{
    if(!r.icon)r.icon=RULEICONS[i%RULEICONS.length];
    if(!RULECOLORS.includes(r.color))r.color=RULECOLORS[i%RULECOLORS.length];
  });
  render();
}
async function save(){try{await store.set("clearsplit-v6",JSON.stringify(D));}catch(e){}}
function toast(m){
  const t=document.getElementById("toast");
  t.innerHTML='<div class="toast">'+m+'</div>';
  setTimeout(()=>t.innerHTML="",2400);
}
const fmt=n=>n.toLocaleString("en-US",{style:"currency",currency:"USD",maximumFractionDigits:0});
const fmtC=n=>n.toLocaleString("en-US",{style:"currency",currency:"USD",minimumFractionDigits:2,maximumFractionDigits:2});
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const activeSubs=()=>CATALOG.filter(s=>D.subs[s.id]!==undefined).map(s=>({...s,price:D.subs[s.id]})).concat(D.customSubs);
const subsMonthly=()=>activeSubs().reduce((a,s)=>a+s.price,0);
const billsMonthly=()=>D.bills.reduce((a,b)=>a+b.price,0);
const fixedMonthly=()=>subsMonthly()+billsMonthly();
const perCheckFixed=()=>fixedMonthly()/D.checksPerMonth;
const lifetime=()=>Object.values(D.totals).reduce((a,v)=>a+v,0);
const monthPaid=()=>{const m=new Date().toISOString().slice(0,7);return D.history.filter(h=>h.date.startsWith(m)).reduce((a,h)=>a+h.amount,0);};

function financeContext(){
  return "User's budget data: Bills "+fmt(billsMonthly())+"/mo ("+D.bills.map(b=>b.name+" "+fmt(b.price)).join(", ")+"). "+
  "Subscriptions "+fmt(subsMonthly())+"/mo: "+(activeSubs().map(s=>s.name+" "+fmtC(s.price)).join(", ")||"none tracked yet")+". "+
  "Allocation buckets: "+D.rules.map(r=>r.name+" "+r.pct+"%").join(", ")+". "+
  "Paid "+D.checksPerMonth+"x/month. "+D.history.length+" paychecks logged, "+fmt(lifetime())+" allocated lifetime.";
}

function computeSplit(amt){
  const rows=[];let rem=amt;
  const fixed=Math.min(rem,perCheckFixed());
  rows.push({label:"Bills + subscriptions",amount:fixed,color:"#64748B",icon:"receipt",
    note:fmt(billsMonthly())+" bills · "+fmt(subsMonthly())+" subs"});
  rem-=fixed;
  const pool=Math.max(0,amt-perCheckFixed());
  for(const r of D.rules){
    const take=Math.max(0,Math.min(rem,pool*(r.pct/100)));
    if(take>0.005){rows.push({label:r.name,amount:take,color:r.color,icon:r.icon||"wallet",note:r.pct+"% of what's left",ruleId:r.id});rem-=take;}
  }
  if(rem>0.005)rows.push({label:"Unassigned",amount:rem,color:"#A6B2C6",icon:"q",note:"Rules under 100%",ruleId:"unassigned"});
  return rows;
}

async function askClaude(messages){
  let lastErr="";
  for(let attempt=0;attempt<2;attempt++){
    try{
      const res=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,messages})
      });
      const data=await res.json().catch(()=>null);
      if(!res.ok||!data){lastErr=(data&&data.error&&data.error.message)||("HTTP "+res.status);continue;}
      if(data.error){lastErr=data.error.message||"API error";continue;}
      const text=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n").trim();
      if(text)return{ok:true,text};
      lastErr="Empty response";
    }catch(e){lastErr=e.message||"Network error";}
  }
  return{ok:false,text:lastErr};
}

window.sendLisa=async(preset)=>{
  if(lisaBusy)return;
  const inp=document.getElementById("lisain");
  const text=preset||(inp?inp.value.trim():"");
  if(!text)return;
  chat.push({role:"user",text});
  lisaBusy=true;render();
  const msgs=[{role:"user",content:
    "You are Lisa, an AI assistant built into ClearSplit, a paycheck-splitting budget app. You are open about being an AI. "+
    "Be warm, plain-spoken (10th-grade level), practical, and concise (under 120 words unless asked for more). Write like a text message — short sentences, no markdown. "+
    "You give general financial education and budgeting help, not professional financial advice; mention that briefly only for major decisions.\n\n"+
    financeContext()+"\n\nConversation so far:\n"+
    chat.slice(0,-1).map(m=>(m.role==="user"?"User: ":"Lisa: ")+m.text).join("\n")+
    "\n\nUser's new message: "+text+"\n\nReply as Lisa:"}];
  const res=await askClaude(msgs);
  if(res.ok){chat.push({role:"lisa",text:res.text});}
  else if(/failed to fetch|networkerror|load failed/i.test(res.text)){
    chat.push({role:"lisa",err:true,text:"I can't reach my AI service from this page. Everything else in the app still works — open ClearSplit inside Claude to chat with me."});}
  else{chat.push({role:"lisa",err:true,text:"Connection hiccup ("+res.text+"). Try me again in a sec."});}
  lisaBusy=false;render();
};

window.genTips=async()=>{
  if(tipsBusy)return;
  tipsBusy=true;tips=null;render();
  const res=await askClaude([{role:"user",content:
    "You are Lisa, an AI assistant in a budgeting app. Based on this user's real data, generate exactly 4 smart, specific ways they could save money. "+
    financeContext()+" "+
    'Respond with ONLY a raw JSON array, no markdown, no backticks: '+
    '[{"title":"short title","detail":"1-2 sentences using their actual numbers","save":"$X/mo"}]'}]);
  if(res.ok){
    try{tips=JSON.parse(res.text.replace(/```json|```/gi,"").trim());}
    catch(e){tips=[{title:"Almost got it",detail:"Lisa answered in the wrong format. Tap Refresh to try again.",save:""}];}
  }else if(/failed to fetch|networkerror|load failed/i.test(res.text)){
    tips=[{title:"Not available on this page",detail:"Lisa can't reach her AI service here. Everything else in the app still works — open ClearSplit inside Claude for AI tips.",save:""}];
  }else{
    tips=[{title:"Connection issue",detail:"Lisa couldn't connect ("+res.text+"). Tap Refresh to retry.",save:""}];
  }
  tipsBusy=false;render();
};

window.go=s=>{screen=s;if(s==="split"){wizStep=1;preview=null;}render();window.scrollTo({top:0});};
window.setAmt=v=>{checkVal=String(v);const el=document.getElementById("checkin");if(el)el.value=v;};
window.wizNext=()=>{
  const el=document.getElementById("checkin");checkVal=el?el.value:checkVal;
  const amt=Number(checkVal);
  if(!amt||amt<=0){toast("Enter your paycheck first");return;}
  preview={amount:amt,rows:computeSplit(amt)};wizStep=2;render();
};
window.wizBack=()=>{wizStep=1;render();};
window.logSplit=async()=>{
  if(!preview)return;
  for(const r of preview.rows){if(r.ruleId)D.totals[r.ruleId]=(D.totals[r.ruleId]||0)+r.amount;}
  D.history.unshift({date:new Date().toISOString().slice(0,10),amount:preview.amount,
    rows:preview.rows.map(r=>({label:r.label,amount:Math.round(r.amount*100)/100}))});
  D.history=D.history.slice(0,100);
  preview=null;checkVal="";wizStep=1;
  await save();go("ledger");toast("Paycheck logged");
};
window.toggleSub=async id=>{
  const s=CATALOG.find(x=>x.id===id);
  if(D.subs[id]!==undefined)delete D.subs[id];else D.subs[id]=s.price;
  await save();render();
};
window.setSubPrice=async(id,v)=>{D.subs[id]=Number(v)||0;await save();};
window.addCustom=async()=>{
  const n=document.getElementById("csName").value,p=Number(document.getElementById("csPrice").value);
  if(!n||!p){toast("Name and price needed");return;}
  D.customSubs.push({id:uid(),name:n,cat:"Custom",price:p});
  await save();render();toast("Added");
};
window.rmCustom=async id=>{D.customSubs=D.customSubs.filter(s=>s.id!==id);await save();render();};
window.setBillName=async(id,v)=>{const b=D.bills.find(x=>x.id===id);if(b)b.name=v;await save();};
window.setBillPrice=async(id,v)=>{const b=D.bills.find(x=>x.id===id);if(b)b.price=Number(v)||0;await save();};
window.addBill=async()=>{
  const n=document.getElementById("nbName").value,p=Number(document.getElementById("nbPrice").value);
  if(!n||!p){toast("Name and price needed");return;}
  D.bills.push({id:uid(),name:n,price:p});await save();render();toast("Bill added");
};
window.rmBill=async id=>{D.bills=D.bills.filter(b=>b.id!==id);await save();render();};
window.setRuleName=async(id,v)=>{const r=D.rules.find(x=>x.id===id);if(r)r.name=v;await save();};
window.setRulePct=async(id,v)=>{
  const r=D.rules.find(x=>x.id===id);if(r)r.pct=Number(v);
  const tag=document.getElementById("pt-"+id);if(tag)tag.textContent=v+"%";
  await save();
};
window.addRule=async()=>{
  const i=D.rules.length;
  D.rules.push({id:uid(),name:"New bucket",pct:0,color:RULECOLORS[i%RULECOLORS.length],icon:RULEICONS[i%RULEICONS.length]});
  await save();render();
};
window.rmRule=async id=>{D.rules=D.rules.filter(r=>r.id!==id);await save();render();};
window.setChecks=async n=>{D.checksPerMonth=n;await save();render();};
window.clearHist=async()=>{
  if(!confirm("Clear all logged paychecks and bucket totals? This can't be undone."))return;
  D.history=[];D.totals={};await save();render();toast("History cleared");
};
window.setSearch=v=>{subSearch=v;render(true);};
window.setCat=c=>{catFilter=c;render();};
window.setTab=t=>{ledgerTab=t;render();};

function donut(rows,total,size){
  const R=(size-13)/2, C=2*Math.PI*R;
  let off=0, segs="";
  rows.forEach((r,i)=>{
    const frac=r.amount/total, len=frac*C;
    segs+='<circle class="val" cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+R+'" stroke="'+r.color+'" '+
      'stroke-dasharray="'+Math.max(0,len-3)+' '+(C-len+3)+'" stroke-dashoffset="'+(-off)+'" style="--c:'+C+';animation-delay:'+(0.1+i*0.05)+'s"/>';
    off+=len;
  });
  return '<div style="position:relative;width:'+size+'px;height:'+size+'px;flex-shrink:0">'+
    '<svg class="ring" width="'+size+'" height="'+size+'" role="img" aria-label="Allocation breakdown">'+
    '<circle class="bgc" cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+R+'"/>'+segs+'</svg>'+
    '<div class="ringcenter"><div class="n mono">'+fmt(total)+'</div><div class="k">this check</div></div></div>';
}

function countUp(){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  document.querySelectorAll('[data-count]').forEach(el=>{
    const to=Number(el.dataset.count);
    if(!to)return;
    const t0=performance.now(),dur=750;
    const step=t=>{
      const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3);
      el.textContent=fmt(to*e);
      if(p<1)requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}

  if(keepFocus){
    const inp=document.querySelector(".searchbar input");
    if(inp){inp.focus();const v=inp.value;inp.value="";inp.value=v;}
  }
}
load();
</script>
