<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ClearSplit</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap');
:root{
  --bg:#060706; --bg2:#0B0C0A; --card:#121311; --card2:#181A16;
  --line:#22241F; --line2:#30332C; --hair:#1A1C18;
  --ink:#F2F0EA; --sub:#A9A89F; --faint:#6D6C63;
  --acc:#35C98A; --acc2:#22A06B; --accdim:rgba(53,201,138,.14); --accline:rgba(53,201,138,.28);
  --sand:#CBC5B4;
  --iblue:#0A84FF; --iblue2:#0060DF; --igray:#232326;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;
  min-height:100vh;letter-spacing:-.01em;background:var(--bg)}
.serif{font-family:'Instrument Serif',Georgia,serif;font-weight:400;letter-spacing:0}
.mono{font-variant-numeric:tabular-nums}
.app{max-width:440px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:116px}
.i{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.ruled{background-image:repeating-linear-gradient(180deg,transparent 0 27px,var(--hair) 27px 28px)}

@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.92);opacity:0}70%{transform:scale(1.03)}100%{transform:scale(1);opacity:1}}
@keyframes slideL{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
@keyframes bubbleIn{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
@keyframes fillbar{from{width:0}}
@keyframes drawRing{from{stroke-dashoffset:var(--c)}}
@keyframes think{0%,80%,100%{opacity:.25}40%{opacity:1}}
.r{animation:rise .5s cubic-bezier(.22,.9,.3,1) both}
.sl{animation:slideL .45s cubic-bezier(.22,.9,.3,1) both}
.r1{animation-delay:.05s}.r2{animation-delay:.1s}.r3{animation-delay:.15s}.r4{animation-delay:.2s}.r5{animation-delay:.25s}
.press{transition:transform .14s cubic-bezier(.3,.7,.4,1.3)}
.press:active{transform:scale(.965)}
@media(prefers-reduced-motion:reduce){.r,.sl{animation:none}.press{transition:none}
  .progbar i,.ring circle.val{animation:none !important}.msg{animation:none}}

/* ── Header ── */
.head{display:flex;align-items:center;justify-content:space-between;padding:24px 22px 8px}
.wordmark{font-size:22px;line-height:1}
.wordmark em{color:var(--acc);font-style:italic}
.headbtns{display:flex;gap:9px}
.iconbtn{width:42px;height:42px;border-radius:12px;background:var(--card);border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;color:var(--sub)}
.iconbtn .bub{position:absolute;top:-4px;right:-4px;background:var(--acc);color:#07130D;font-size:9.5px;font-weight:700;
  min-width:17px;height:17px;border-radius:99px;display:flex;align-items:center;justify-content:center;padding:0 4px;border:2px solid var(--bg)}
.pagewrap{padding:8px 22px 0}
h1.big{font-size:38px;line-height:1.02;margin:8px 0 6px}
.pagesub{font-size:13px;color:var(--sub);font-weight:500;margin-bottom:20px}

/* ── Hero ── */
.hero{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--bg2)}
.hero .inner{padding:24px 22px 20px;position:relative}
.hero .toprow{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.tag{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.tag b{color:var(--acc)}
.hero .amount{font-size:56px;line-height:1}
.hero .sub{font-size:13px;color:var(--sub);margin-top:8px;font-weight:500}
.hero .sub b{color:var(--acc);font-weight:600}
.hero .statrow{display:flex;border-top:1px solid var(--line);background:var(--card)}
.hero .st{flex:1;padding:14px 12px 13px;text-align:center;border-left:1px solid var(--line)}
.hero .st:first-child{border-left:none}
.hero .st .v{font-size:15.5px;font-weight:600}
.hero .st .k{font-size:9.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-top:3px}

.sect{display:flex;align-items:baseline;justify-content:space-between;margin:30px 2px 13px}
.sect h3{font-size:22px}
.sect .meta{font-size:11px;font-weight:600;color:var(--faint);letter-spacing:.04em}

/* ── Photo cards ── */
.photorow{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -22px;padding:0 22px 6px}
.photorow::-webkit-scrollbar{display:none}
.pcard{position:relative;flex:0 0 210px;height:140px;border-radius:16px;overflow:hidden;cursor:pointer;
  border:1px solid var(--line);background:var(--card)}
.pcard img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pcard .grad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,6,5,.05) 25%,rgba(4,6,5,.92))}
.pcard .fallback{position:absolute;inset:0}
.pcard .cap{position:absolute;left:13px;right:13px;bottom:11px;color:#fff;z-index:2}
.pcard .cap .t{font-size:14px;font-weight:600;letter-spacing:-.015em}
.pcard .cap .s{font-size:10.5px;color:rgba(255,255,255,.72);font-weight:500;margin-top:1px}
.bannerimg{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line);height:150px;margin-bottom:16px;cursor:pointer}
.bannerimg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bannerimg .grad{position:absolute;inset:0;background:linear-gradient(90deg,rgba(4,6,5,.92) 30%,rgba(4,6,5,.25))}
.bannerimg .cap{position:absolute;left:18px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;max-width:70%;z-index:2}
.bannerimg .cap .t{font-size:21px;line-height:1.1;color:#fff}
.bannerimg .cap .t em{color:var(--acc)}
.bannerimg .cap .s{font-size:11.5px;color:rgba(255,255,255,.78);font-weight:500;margin-top:5px}

/* ── Rows/stacks ── */
.stack{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--card)}
.row{display:flex;align-items:center;gap:13px;padding:15px 17px;border-top:1px solid var(--hair);cursor:pointer;
  background:transparent;width:100%;text-align:left;font-family:inherit;color:var(--ink);letter-spacing:inherit;transition:background .14s}
.row:first-child{border-top:none}
.row:active{background:var(--card2)}
.rowico{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  background:var(--bg2);border:1px solid var(--line);color:var(--sand)}
.rowico.acc{color:var(--acc);border-color:var(--accline);background:var(--accdim)}
.rowico .i{width:17px;height:17px}
.row .txt{flex:1;min-width:0}
.row .nm{font-size:14.5px;font-weight:600}
.row .ds{font-size:11.5px;color:var(--faint);margin-top:2px;font-weight:500}
.row .amt{font-size:14px;font-weight:600;color:var(--sand)}
.row .go{color:var(--faint)}
.row input.nm{border:none;outline:none;background:none;font-family:inherit;color:var(--ink);width:100%}
.tick{width:22px;height:22px;border-radius:8px;border:1.5px solid var(--line2);display:flex;align-items:center;
  justify-content:center;flex-shrink:0;color:transparent;transition:all .16s;background:var(--bg2)}
.tick .i{width:13px;height:13px;stroke-width:2.6}
.tick.on{background:var(--acc);border-color:var(--acc);color:#07130D}

.btn{background:var(--acc);color:#07130D;border:none;border-radius:13px;padding:15px 24px;font-family:inherit;
  font-size:14px;font-weight:700;cursor:pointer}
.btn:active{background:var(--acc2)}
.btn.sm{padding:9px 15px;font-size:12px;border-radius:10px}
.btn.ghost{background:var(--card);color:var(--sub);border:1px solid var(--line)}
.field{display:flex;align-items:center;background:var(--bg2);border:1px solid var(--line2);border-radius:14px;padding:15px 17px}
.field:focus-within{border-color:var(--acc)}
.field span{font-size:20px;color:var(--faint);margin-right:9px}
.field input{background:none;border:none;outline:none;color:var(--ink);font-size:24px;font-weight:600;width:100%;
  font-family:inherit;font-variant-numeric:tabular-nums}
.field input::placeholder{color:var(--faint)}
.smallin{border:1px solid var(--line2);border-radius:11px;padding:11px 13px;font-family:inherit;font-size:13.5px;
  font-weight:500;outline:none;background:var(--bg2);color:var(--ink)}
.smallin:focus{border-color:var(--acc)}
.pedit{display:flex;align-items:center;background:var(--bg2);border-radius:10px;padding:8px 10px;border:1px solid var(--line)}
.pedit span{font-size:11.5px;color:var(--faint);margin-right:2px}
.pedit input{border:none;outline:none;background:none;width:56px;text-align:right;font-size:13px;font-weight:600;
  font-family:inherit;color:var(--ink);font-variant-numeric:tabular-nums}
.rmx{width:30px;height:30px;border-radius:9px;background:transparent;border:1px solid var(--line);color:var(--faint);
  cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.rmx .i{width:11px;height:11px;stroke-width:2.2}
.addbar{display:flex;gap:8px;padding:13px 15px;border-top:1px solid var(--hair)}
.addbar .nm{flex:1;min-width:0}
.addbar .pr{width:88px}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{background:var(--card);border:1px solid var(--line);color:var(--sub);border-radius:10px;padding:9px 14px;
  font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;white-space:nowrap;flex-shrink:0}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.searchbar{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:13px;
  padding:12px 15px;margin-bottom:12px;color:var(--faint)}
.searchbar input{border:none;outline:none;background:none;font-family:inherit;font-size:14px;font-weight:500;flex:1;color:var(--ink)}

/* ── Wizard ── */
.wiz{border:1px solid var(--accline);border-radius:18px;overflow:hidden;background:linear-gradient(180deg,#0F1F17,#0A120E)}
.wiz .pad{padding:22px}
.wiz .bar-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.wiz .steptag{font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
.xbtn{width:34px;height:34px;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--sub);
  cursor:pointer;display:flex;align-items:center;justify-content:center}
.progbar{height:3px;background:var(--line);overflow:hidden;border-radius:99px;margin-bottom:22px}
.progbar i{display:block;height:100%;background:var(--acc);width:var(--w);animation:fillbar .5s cubic-bezier(.22,.9,.3,1) both}
.wiz h2.q{font-size:34px;line-height:1.05;margin-bottom:8px}
.wiz h2.q em{color:var(--acc)}
.wiz .qs{font-size:13px;color:var(--sub);margin-bottom:20px;font-weight:500}
.quickamts{display:flex;gap:7px;margin:12px 0 18px}
.qa{background:var(--card);border:1px solid var(--line);color:var(--sub);border-radius:10px;padding:9px 14px;
  font-size:12.5px;font-weight:600;cursor:pointer;font-family:inherit}
.ctarow{display:flex;gap:10px;margin-top:4px}
.backbtn{width:52px;height:52px;border-radius:13px;background:var(--card);border:1px solid var(--line);
  color:var(--sub);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.ctarow .btn{flex:1;height:52px}

.ringwrap{display:flex;align-items:center;gap:20px;margin-bottom:18px}
.ring{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10;stroke-linecap:round}
.ring circle.bgc{stroke:var(--line)}
.ring circle.val{animation:drawRing 1s cubic-bezier(.22,.9,.3,1) both}
.ringcenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringcenter .n{font-size:16px;font-weight:600}
.ringcenter .k{font-size:8.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.legend{flex:1}
.legend .lg{display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:500;color:var(--sub);padding:3.5px 0}
.legend .sw{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.legend .lv{margin-left:auto;font-weight:600;color:var(--ink)}

.slrow{padding:14px 17px;border-top:1px solid var(--hair)}
.slrow:first-child{border-top:none}
.slrow .t{display:flex;align-items:center;gap:11px;margin-bottom:10px}
.slrow input.nm{border:none;outline:none;background:none;font-family:inherit;font-size:14px;font-weight:600;flex:1;color:var(--ink)}
.slrow .pcttag{font-size:12px;font-weight:700;color:var(--acc);font-variant-numeric:tabular-nums;min-width:38px;text-align:right}
.slrow input[type=range]{width:100%;accent-color:var(--acc);height:20px}

/* ── Lisa: iMessage-style ── */
.aibadge{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;font-weight:700;letter-spacing:.1em;
  text-transform:uppercase;color:var(--acc);border:1px solid var(--accline);background:var(--accdim);
  border-radius:99px;padding:4px 9px}
.aibadge i{width:5px;height:5px;border-radius:99px;background:var(--acc);display:inline-block}
.imsg-head{display:flex;flex-direction:column;align-items:center;padding:6px 0 14px;border-bottom:1px solid var(--hair);margin-bottom:14px}
.imsg-ava{width:62px;height:62px;border-radius:99px;background:linear-gradient(140deg,#4ADE9C,#159865);
  display:flex;align-items:center;justify-content:center;color:#06150E;margin-bottom:7px;position:relative}
.imsg-ava .i{width:30px;height:30px;stroke-width:2}
.imsg-ava .live{position:absolute;bottom:1px;right:1px;width:14px;height:14px;border-radius:99px;background:#35C98A;border:3px solid var(--bg)}
.imsg-name{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600}
.imsg-name .chev{color:var(--faint);font-size:12px}
.imsg-sub{font-size:10.5px;color:var(--faint);font-weight:500;margin-top:2px}
.chatbox{display:flex;flex-direction:column;gap:3px;margin-bottom:12px;max-height:46vh;overflow-y:auto;scrollbar-width:none;padding:2px}
.chatbox::-webkit-scrollbar{display:none}
.stamp{text-align:center;font-size:10px;font-weight:600;color:var(--faint);margin:6px 0 8px;letter-spacing:.02em}
.stamp b{color:var(--sub)}
.msg{max-width:78%;padding:9px 14px;font-size:14.5px;line-height:1.4;font-weight:400;white-space:pre-wrap;
  animation:bubbleIn .3s cubic-bezier(.22,.9,.3,1) both;letter-spacing:-.005em}
.msg.user{align-self:flex-end;background:linear-gradient(180deg,var(--iblue),var(--iblue2));color:#fff;
  border-radius:18px 18px 5px 18px;margin-top:6px}
.msg.user+.msg.user{border-radius:18px 5px 5px 18px;margin-top:2px}
.msg.lisa{align-self:flex-start;background:var(--igray);color:#E9E9EC;border-radius:18px 18px 18px 5px;margin-top:6px}
.msg.lisa+.msg.lisa{border-radius:5px 18px 18px 5px;margin-top:2px}
.msg.lisa.err{background:#2A1B1B;color:#E8B4B4}
.receipt{align-self:flex-end;font-size:9.5px;font-weight:600;color:var(--faint);margin:3px 4px 0 0}
.thinking{display:flex;gap:4px;padding:12px 15px;align-self:flex-start;background:var(--igray);border-radius:18px 18px 18px 5px;margin-top:6px}
.thinking i{width:7px;height:7px;border-radius:99px;background:#8E8E93;animation:think 1.2s infinite}
.thinking i:nth-child(2){animation-delay:.2s}
.thinking i:nth-child(3){animation-delay:.4s}
.chatinput{display:flex;gap:8px;align-items:center}
.chatinput .fld{flex:1;display:flex;align-items:center;background:var(--card);border:1px solid var(--line2);
  border-radius:99px;padding:4px 5px 4px 17px}
.chatinput input{flex:1;background:none;border:none;outline:none;font-family:inherit;font-size:14.5px;
  font-weight:400;color:var(--ink);padding:9px 0}
.chatinput input::placeholder{color:var(--faint)}
.sendbtn{width:36px;height:36px;border-radius:99px;background:var(--iblue);border:none;color:#fff;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sendbtn .i{width:16px;height:16px;stroke-width:2.4}
.tipcard{border:1px solid var(--line);border-radius:15px;background:var(--card);padding:15px 16px;margin-bottom:10px}
.tipcard .th{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.tipcard .tn{font-size:14px;font-weight:600;flex:1}
.tipcard .save{font-size:10.5px;font-weight:700;color:var(--acc);border:1px solid var(--accline);background:var(--accdim);
  border-radius:99px;padding:3px 9px;white-space:nowrap}
.tipcard .td{font-size:12.5px;color:var(--sub);line-height:1.55;font-weight:500}

.hrow{padding:15px 17px;border-top:1px solid var(--hair)}
.hrow:first-child{border-top:none}
.hrow .t{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.hrow .d{font-size:10px;font-weight:700;color:var(--faint);letter-spacing:.09em;text-transform:uppercase}
.hrow .a{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.hrow .tags{display:flex;flex-wrap:wrap;gap:3px 14px;font-size:11.5px;color:var(--faint);font-weight:500}
.hrow .tags b{color:var(--sand);font-weight:600;font-variant-numeric:tabular-nums}

.bnav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;z-index:80;
  background:rgba(10,11,9,.95);backdrop-filter:blur(18px);padding:7px;border-radius:18px;
  border:1px solid var(--line2);box-shadow:0 22px 48px -12px rgba(0,0,0,.9)}
.bnav button{min-width:58px;height:52px;border-radius:12px;background:transparent;border:none;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--faint);
  transition:background .18s,color .18s;font-family:inherit;padding:0 8px}
.bnav button .nvl{font-size:9px;font-weight:600}
.bnav button.on{background:var(--accdim);color:var(--acc)}
.bnav button.cta{background:var(--acc);color:#07130D;margin:0 3px}
.bnav button .i{width:19px;height:19px}

.toastbox{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:99;width:max-content;max-width:88vw}
.toast{background:var(--card2);color:var(--ink);padding:12px 20px;border-radius:12px;font-size:13px;font-weight:600;
  animation:pop .35s;border:1px solid var(--line2);box-shadow:0 18px 44px rgba(0,0,0,.7)}
.subtle{font-size:12px;color:var(--faint);font-weight:500;line-height:1.55}
</style>
</head>
<body>
<div class="app">
  <div class="toastbox" id="toast"></div>
  <div id="screen"></div>
  <nav class="bnav" id="bnav"></nav>
</div>

<script>
function ic(name,cls){
  const P={
    home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/>',
    plus:'<path d="M12 5v14M5 12h14"/>',
    x:'<path d="M6 6l12 12M18 6L6 18"/>',
    note:'<rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8 9h8M8 13h5"/>',
    arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
    back:'<path d="M19 12H5M11 18l-6-6 6-6"/>',
    check:'<path d="M4 12.5 9.5 18 20 6.5"/>',
    search:'<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
    card:'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18M7 15h4"/>',
    doc:'<rect x="5" y="3" width="14" height="18" rx="3"/><path d="M9 8h6M9 12h6M9 16h4"/>',
    receipt:'<path d="M6 3h12v18l-2-1.5L14 21l-2-1.5L10 21l-2-1.5L6 21V3Z"/><path d="M9 8h6M9 12h6"/>',
    split:'<path d="M12 3v7"/><path d="M12 10 6 16M12 10l6 6"/><circle cx="6" cy="18" r="2"/><circle cx="18" cy="18" r="2"/><circle cx="12" cy="4" r="1.5"/>',

function computeSplit(amt){
  const rows=[];let rem=amt;
  const fixed=Math.min(rem,perCheckFixed());
  rows.push({label:"Bills + subscriptions",amount:fixed,color:"#6D6C63",icon:"receipt",
    note:fmt(billsMonthly())+" bills · "+fmt(subsMonthly())+" subs"});
  rem-=fixed;
  const pool=Math.max(0,amt-perCheckFixed());
  for(const r of D.rules){
    const take=Math.max(0,Math.min(rem,pool*(r.pct/100)));
    if(take>0.005){rows.push({label:r.name,amount:take,color:r.color,icon:r.icon||"wallet",note:r.pct+"% of what's left",ruleId:r.id});rem-=take;}
  }
  if(rem>0.005)rows.push({label:"Unassigned",amount:rem,color:"#4A4C45",icon:"q",note:"Rules under 100%",ruleId:"unassigned"});
  return rows;
}

async function askClaude(messages){
  let lastErr="";
  for(let attempt=0;attempt<2;attempt++){
    try{
      const res=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,messages})
      });
      const data=await res.json().catch(()=>null);
      if(!res.ok||!data){lastErr=(data&&data.error&&data.error.message)||("HTTP "+res.status);continue;}
      if(data.error){lastErr=data.error.message||"API error";continue;}
      const text=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n").trim();
      if(text)return{ok:true,text};
      lastErr="Empty response";
    }catch(e){lastErr=e.message||"Network error";}
  }
  return{ok:false,text:lastErr};
}

function donut(rows,total,size){
  const R=(size-12)/2, C=2*Math.PI*R;
  let off=0, segs="";
  rows.forEach((r,i)=>{
    const frac=r.amount/total, len=frac*C;
    segs+='<circle class="val" cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+R+'" stroke="'+r.color+'" '+
      'stroke-dasharray="'+Math.max(0,len-3)+' '+(C-len+3)+'" stroke-dashoffset="'+(-off)+'" style="--c:'+C+';animation-delay:'+(0.15+i*0.05)+'s"/>';
    off+=len;
  });
  return '<div style="position:relative;width:'+size+'px;height:'+size+'px;flex-shrink:0">'+
    '<svg class="ring" width="'+size+'" height="'+size+'"><circle class="bgc" cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+R+'"/>'+segs+'</svg>'+
    '<div class="ringcenter"><div class="n mono">'+fmt(total)+'</div><div class="k">this check</div></div></div>';
}

    '<span class="txt"><span class="nm">'+nm+'</span><span class="ds" style="display:block">'+ds+'</span></span>'+
    '<span class="go">'+ic("arrow")+'</span></button>').join("")+
  '</div>'+
  '<div class="sect r5"><h3 class="serif">The yearly picture</h3><span class="meta mono">'+fmt(sm*12)+'/YR IN SUBS</span></div>'+
  '<div class="tipcard r5"><div class="td">Your subscriptions run <b style="color:var(--ink)">'+fmt(sm*12)+' a year</b>. '+
  'Invested at 8% instead, that stream is roughly <b style="color:var(--acc)">'+fmt(sm*12*14.5)+'</b> in 10 years. Ask Lisa where to trim.</div></div>'+
  '</div>';
}

function lisaHTML(){
  const now=new Date();
  const stamp=now.toLocaleDateString("en-US",{weekday:"long"})+" "+now.toLocaleTimeString("en-US",{hour:"numeric",minute:"2-digit"});
  const lastUserIdx=chat.map(m=>m.role).lastIndexOf("user");
  let chatHTML="";
  chat.forEach((m,i)=>{
    chatHTML+='<div class="msg '+(m.role==="user"?"user":"lisa")+(m.err?" err":"")+'">'+esc(m.text)+'</div>';
    if(m.role==="user"&&i===lastUserIdx&&!lisaBusy&&i===chat.length-1)chatHTML+='<div class="receipt">Delivered</div>';
    if(m.role==="user"&&i===lastUserIdx&&chat[i+1]&&chat[i+1].role==="lisa")chatHTML+='<div class="receipt">Read</div>';
  });
  if(lisaBusy)chatHTML+='<div class="thinking"><i></i><i></i><i></i></div>';
  const suggestions=chat.length===0?
    '<div class="chips" style="margin-bottom:10px">'+["How am I doing?","Cheapest way to invest?","Should I cut any subs?","Explain Roth IRA simply"].map(s=>
    '<button class="chip press" onclick="sendLisa(\''+s+'\')">'+s+'</button>').join("")+'</div>':"";
  return headerHTML()+'<div class="pagewrap">'+
  '<div class="imsg-head r">'+
  '<div class="imsg-ava">'+ic("bot")+'<span class="live"></span></div>'+
  '<div class="imsg-name">Lisa <span class="chev">›</span></div>'+
  '<div class="imsg-sub">AI Assistant · Powered by Claude · sees your budget</div>'+
  '<div style="margin-top:7px"><span class="aibadge"><i></i>AI</span></div>'+
  '</div>'+
  '<div class="sect r1" style="margin-top:6px"><h3 class="serif">Smart ways to save</h3>'+
  '<button class="btn sm press" onclick="genTips()">'+(tips?"Refresh":"Generate")+'</button></div>'+
  (tipsBusy?'<div class="tipcard r2"><div class="td">Lisa\'s AI is reading your numbers…</div></div>':"")+
  (tips?tips.map((t,i)=>'<div class="tipcard sl" style="animation-delay:'+(i*0.07)+'s"><div class="th">'+
    '<span class="rowico acc" style="width:32px;height:32px;border-radius:9px">'+ic("bulb")+'</span>'+
    '<span class="tn">'+esc(t.title)+'</span>'+
    (t.save?'<span class="save">'+esc(t.save)+'</span>':"")+'</div>'+
    '<div class="td">'+esc(t.detail)+'</div></div>').join("")
   :(!tipsBusy?'<div class="tipcard r2"><div class="td">Tap <b style="color:var(--acc)">Generate</b> and Lisa\'s AI will scan your bills, subscriptions, and buckets for specific ways to free up money.</div></div>':""))+
  '<div class="sect r3"><h3 class="serif">Messages</h3><span class="meta">ASK HER ANYTHING</span></div>'+
  suggestions+
  '<div class="chatbox" id="chatbox">'+
  '<div class="stamp"><b>iMessage-style</b> · '+stamp+'</div>'+
  (chat.length===0&&!lisaBusy?'<div class="msg lisa">Hey! I\'m Lisa, the AI inside ClearSplit 👋 I can see your budget setup, so ask me anything — your subs, saving strategies, investing basics, or what to do with your next check.</div>':chatHTML)+
  '</div>'+
  '<div class="chatinput"><div class="fld"><input id="lisain" placeholder="Ask Lisa…" onkeydown="if(event.key===\'Enter\')sendLisa()">'+
  '<button class="sendbtn press" onclick="sendLisa()">'+ic("up")+'</button></div></div>'+
  '<p class="subtle" style="margin-top:10px;text-align:center">Lisa is an AI. General education, not professional financial advice.</p>'+
  '</div>';
}

function splitHTML(){
  if(wizStep===1){
    return headerHTML()+'<div class="pagewrap"><div class="wiz r"><div class="pad">'+
    '<div class="bar-top"><span class="steptag">Split · Step 1 of 2</span>'+
    '<button class="xbtn press" onclick="go(\'home\')">'+ic("x")+'</button></div>'+
    '<div class="progbar"><i style="--w:50%"></i></div>'+
    '<h2 class="q serif">How much did<br>you get <em>paid?</em></h2>'+
    '<div class="qs">This pay period\'s take-home, after taxes</div>'+
    '<div class="field"><span class="mono">$</span><input id="checkin" type="number" inputmode="decimal" placeholder="4,000" value="'+esc(checkVal)+'"></div>'+
    '<div class="quickamts">'+[2000,3000,4000,5000].map(v=>'<button class="qa press" onclick="setAmt('+v+')">$'+(v/1000)+'k</button>').join("")+'</div>'+
    '<div class="subtle" style="margin-bottom:18px">Fixed costs of '+fmtC(perCheckFixed())+' clear first · '+D.checksPerMonth+' checks/mo</div>'+
    '<div class="ctarow"><button class="btn press" onclick="wizNext()">Continue</button></div>'+
    '</div></div></div>';
  }
  const p=preview;
  return headerHTML()+'<div class="pagewrap"><div class="wiz r"><div class="pad">'+
  '<div class="bar-top"><span class="steptag">Split · Step 2 of 2</span>'+
  '<button class="xbtn press" onclick="go(\'home\')">'+ic("x")+'</button></div>'+
  '<div class="progbar"><i style="--w:100%"></i></div>'+
  '<h2 class="q serif">Your <em>allocation</em></h2>'+
  '<div class="qs">Where '+fmt(p.amount)+' should go</div>'+
  '<div class="ringwrap">'+donut(p.rows,p.amount,112)+
  '<div class="legend">'+p.rows.slice(0,5).map(r=>
    '<div class="lg"><span class="sw" style="background:'+r.color+'"></span>'+esc(r.label)+
    '<span class="lv mono">'+Math.round(r.amount/p.amount*100)+'%</span></div>').join("")+'</div></div>'+
  '<div class="stack" style="background:var(--bg2)">'+
  p.rows.map((r,i)=>
    '<div class="row sl" style="animation-delay:'+(0.1+i*0.05)+'s;cursor:default">'+
    '<span class="rowico" style="color:'+r.color+';border-color:'+r.color+'44">'+ic(r.icon)+'</span>'+
    '<span class="txt"><span class="nm">'+esc(r.label)+'</span><span class="ds" style="display:block">'+esc(r.note)+'</span></span>'+
    '<span class="amt mono" style="color:var(--ink)">'+fmtC(r.amount)+'</span></div>').join("")+
  '</div>'+
  '<div class="ctarow" style="margin-top:16px"><button class="backbtn press" onclick="wizBack()">'+ic("back")+'</button>'+
  '<button class="btn press" onclick="logSplit()">Log this paycheck</button></div>'+
  '</div></div></div>';
}

function subsHTML(){
  const filtered=CATALOG.filter(s=>(catFilter==="All"||s.cat===catFilter)&&s.name.toLowerCase().includes(subSearch.toLowerCase()));
  return headerHTML()+'<div class="pagewrap">'+
  '<h1 class="big serif r">Subscriptions</h1>'+
  '<p class="pagesub r"><span class="mono" style="font-weight:600;color:var(--acc)">'+fmtC(subsMonthly())+'/mo</span> across '+activeSubs().length+' active</p>'+
  '<div class="searchbar r1">'+ic("search")+'<input placeholder="Search the catalog" value="'+esc(subSearch)+'" oninput="setSearch(this.value)"></div>'+
  '<div class="chips r2">'+["All",...CATS].map(c=>'<button class="chip press'+(catFilter===c?" on":"")+'" onclick="setCat(\''+c+'\')">'+c+'</button>').join("")+'</div>'+
  '<div class="stack r3">'+
  (filtered.map(s=>{
    const on=D.subs[s.id]!==undefined;
    return '<div class="row" onclick="if(event.target.tagName!==\'INPUT\')toggleSub(\''+s.id+'\')">'+
    '<span class="tick'+(on?" on":"")+'">'+ic("check")+'</span>'+
    '<span class="rowico'+(on?" acc":"")+'">'+ic(CATICON[s.cat]||"box")+'</span>'+
    '<span class="txt"><span class="nm" style="'+(on?"":"color:var(--sub)")+'">'+esc(s.name)+'</span><span class="ds" style="display:block">'+esc(s.cat)+'</span></span>'+
    (on?'<div class="pedit"><span>$</span><input type="number" step="0.01" value="'+D.subs[s.id]+'" onchange="setSubPrice(\''+s.id+'\',this.value)"></div>'
       :'<span class="amt mono" style="color:var(--faint)">'+fmtC(s.price)+'</span>')+'</div>';
  }).join("")||'<div class="row" style="cursor:default"><span class="ds">No matches — add it below.</span></div>')+
  '</div>'+
  '<div class="sect r4"><h3 class="serif">Custom</h3><span class="meta">ANYTHING NOT LISTED</span></div>'+
  '<div class="stack r4">'+
  D.customSubs.map(s=>'<div class="row" style="cursor:default"><span class="rowico">'+ic("spark")+'</span>'+
    '<span class="txt"><span class="nm">'+esc(s.name)+'</span></span>'+
    '<span class="amt mono">'+fmtC(s.price)+'</span>'+
    '<button class="rmx press" onclick="rmCustom(\''+s.id+'\')">'+ic("x")+'</button></div>').join("")+
  '<div class="addbar"><input class="smallin nm" id="csName" placeholder="Name (e.g., LA Fitness)"><input class="smallin pr" id="csPrice" type="number" placeholder="$/mo"><button class="btn sm press" onclick="addCustom()">Add</button></div>'+
  '</div></div>';
}

function billsHTML(){
  return headerHTML()+'<div class="pagewrap">'+
  '<h1 class="big serif r">Bills</h1>'+
  '<p class="pagesub r"><span class="mono" style="font-weight:600;color:var(--acc)">'+fmtC(billsMonthly())+'/mo</span> off the top of every check</p>'+
  '<div class="stack r2">'+
  D.bills.map(b=>'<div class="row" style="cursor:default"><span class="rowico">'+ic("receipt")+'</span>'+
    '<span class="txt"><input class="nm" value="'+esc(b.name)+'" onchange="setBillName(\''+b.id+'\',this.value)"></span>'+
    '<div class="pedit"><span>$</span><input type="number" value="'+b.price+'" onchange="setBillPrice(\''+b.id+'\',this.value)"></div>'+
    '<button class="rmx press" onclick="rmBill(\''+b.id+'\')">'+ic("x")+'</button></div>').join("")+
  '<div class="addbar"><input class="smallin nm" id="nbName" placeholder="Bill name"><input class="smallin pr" id="nbPrice" type="number" placeholder="$/mo"><button class="btn sm press" onclick="addBill()">Add</button></div>'+
  '</div></div>';
}

function rulesHTML(){
  const tot=D.rules.reduce((a,r)=>a+r.pct,0);
  return headerHTML()+'<div class="pagewrap">'+
  '<h1 class="big serif r">Buckets</h1>'+
  '<p class="pagesub r"><span class="mono" style="font-weight:600;color:'+(tot===100?"var(--acc)":"#D08A8A")+'">'+tot+'% allocated</span> · divides what\'s left after fixed costs</p>'+
  '<div class="stack r2">'+
  D.rules.map(r=>'<div class="slrow"><div class="t">'+
    '<span class="rowico" style="color:'+r.color+';border-color:'+r.color+'44">'+ic(r.icon||"wallet")+'</span>'+
    '<input class="nm" value="'+esc(r.name)+'" onchange="setRuleName(\''+r.id+'\',this.value)">'+
    '<span class="pcttag" id="pt-'+r.id+'">'+r.pct+'%</span>'+
    '<button class="rmx press" onclick="rmRule(\''+r.id+'\')">'+ic("x")+'</button></div>'+
    '<input type="range" min="0" max="100" value="'+r.pct+'" oninput="setRulePct(\''+r.id+'\',this.value)"></div>').join("")+
  '<div class="addbar" style="justify-content:center"><button class="btn sm press" onclick="addRule()">Add bucket</button></div>'+
  '</div>'+
  '<div class="sect r3"><h3 class="serif">Pay frequency</h3><span class="meta">CHECKS PER MONTH</span></div>'+
  '<div class="chips r3">'+[1,2,3,4].map(n=>
    '<button class="chip press'+(D.checksPerMonth===n?" on":"")+'" style="padding:11px 20px;font-size:13.5px" onclick="setChecks('+n+')">'+n+'×</button>').join("")+'</div>'+
  '</div>';
}

function ledgerHTML(){
  const tabs='<div class="chips" style="margin-bottom:12px">'+
    [["history","History"],["buckets","Buckets"]].map(([id,nm])=>
    '<button class="chip press'+(ledgerTab===id?" on":"")+'" onclick="setTab(\''+id+'\')">'+nm+'</button>').join("")+'</div>';
  let body="";
  if(ledgerTab==="history"){
    body='<div class="stack">'+
    (D.history.length===0?'<div class="row" style="cursor:default"><span class="ds">Nothing logged yet — run a split first.</span></div>'
    :D.history.map((h,i)=>'<div class="hrow sl" style="animation-delay:'+(Math.min(i,8)*0.04)+'s">'+
      '<div class="t"><span class="d">'+h.date+'</span><span class="a mono">'+fmt(h.amount)+'</span></div>'+
      '<div class="tags">'+h.rows.map(r=>esc(r.label)+' <b class="mono">'+fmt(r.amount)+'</b>').join("")+'</div></div>').join(""))+
    '</div>'+
    (D.history.length?'<button class="btn ghost sm press" style="margin-top:12px" onclick="clearHist()">Clear all</button>':"");
  }else{
    const keys=D.rules.concat([{id:"unassigned",name:"Unassigned",color:"#4A4C45",icon:"q"}]).filter(r=>D.totals[r.id]);
    body='<div class="stack">'+
    (keys.length===0?'<div class="row" style="cursor:default"><span class="ds">No totals yet.</span></div>'
    :keys.map((r,i)=>'<div class="row sl" style="animation-delay:'+(i*0.04)+'s;cursor:default">'+
      '<span class="rowico" style="color:'+(r.color||"var(--sand)")+'">'+ic(r.icon||"wallet")+'</span>'+
      '<span class="txt"><span class="nm">'+esc(r.name)+'</span></span>'+
      '<span class="amt mono" style="color:var(--ink)">'+fmt(D.totals[r.id])+'</span></div>').join(""))+'</div>';
  }
  return headerHTML()+'<div class="pagewrap">'+
  '<h1 class="big serif r">The Ledger</h1>'+
  '<p class="pagesub r">'+D.history.length+' paychecks · <span class="mono" style="color:var(--acc);font-weight:600">'+fmt(lifetime())+'</span> lifetime allocated</p>'+
  '<div class="r1">'+tabs+body+'</div></div>';
}

const BNAV=[["home","home","Home"],["lisa","bot","Lisa"],["split","plus","","cta"],["subs","card","Subs"],["ledger","doc","Ledger"]];
function render(keepFocus){
  document.getElementById("bnav").innerHTML=BNAV.map(([id,icn,lbl,cls])=>
    '<button class="press '+(cls||"")+' '+(screen===id&&!cls?"on":"")+'" onclick="go(\''+id+'\')">'+ic(icn)+
    (lbl?'<span class="nvl">'+lbl+'</span>':'')+'</button>').join("");
  const scr={home:homeHTML,lisa:lisaHTML,split:splitHTML,subs:subsHTML,bills:billsHTML,rules:rulesHTML,ledger:ledgerHTML}[screen];
  document.getElementById("screen").innerHTML=scr();
  const box=document.getElementById("chatbox");if(box)box.scrollTop=box.scrollHeight;
  if(keepFocus){
    const inp=document.querySelector(".searchbar input");
    if(inp){inp.focus();const v=inp.value;inp.value="";inp.value=v;}
  }
}
load();
</script>
</body>
</html>
