<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ClearSplit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Pastel gradient invoice-app aesthetic: mint→lilac wash, white circles,
   tall colored pills, black pill CTA, white sheets, dashed dividers */
:root{
  --ink:#191C1F; --sub:#5A6470; --faint:#8A94A0; --disabled:#B4BCC6;
  --white:#FFFFFF; --sheet:#FFFFFF; --chipbg:#F2F4F6; --line:#E7EAEE;
  --black:#17191C; --on-black:#FFFFFF;
  --mint:#83E6AB; --mint-ink:#0C3D24;
  --butter:#F9E88A; --butter-ink:#584B06;
  --lilac:#D8CBF4; --lilac-ink:#3A2A66;
  --coral:#F4795B; --coral-soft:#FADFD6; --coral-ink:#7A2A17;
  --sky:#BFE5F2; --rosec:#F5D2E0;
  --pos:#118A52; --neg:#C24A32; --neg-soft:#FAE9E4;
  --ring:#17191C;
  --sh-circ:0 2px 6px rgba(25,28,31,.07),0 10px 22px -8px rgba(25,28,31,.16);
  --sh-card:0 2px 8px rgba(25,28,31,.05),0 16px 34px -14px rgba(25,28,31,.16);
  --sh-btn:0 6px 16px -4px rgba(23,25,28,.4);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation}
body{color:var(--ink);font-family:'Poppins',system-ui,-apple-system,sans-serif;
  font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100dvh;
  background:linear-gradient(165deg,#CDEFE3 0%,#D8ECEC 30%,#DFE5F3 62%,#E6DDF2 100%);
  background-attachment:fixed}
button{font-family:inherit;cursor:pointer;color:inherit}
input{font-family:inherit}
.mono{font-variant-numeric:tabular-nums}
:focus-visible{outline:3px solid var(--ring);outline-offset:2px;border-radius:8px}
.app{max-width:480px;margin:0 auto;min-height:100dvh;position:relative;
  padding-bottom:calc(112px + env(safe-area-inset-bottom))}

@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes screenIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes slideL{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
@keyframes popToast{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes drawRing{from{stroke-dashoffset:var(--c)}}
@keyframes think{0%,80%,100%{opacity:.25}40%{opacity:1}}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}
#screen.swap{animation:screenIn .3s cubic-bezier(.25,.6,.3,1) both}
.r{animation:rise .32s cubic-bezier(.25,.6,.3,1) both}
.sl{animation:slideL .3s cubic-bezier(.25,.6,.3,1) both}
.r1{animation-delay:.03s}.r2{animation-delay:.07s}.r3{animation-delay:.11s}.r4{animation-delay:.15s}.r5{animation-delay:.19s}
.press{transition:transform .18s cubic-bezier(.3,1.2,.4,1),box-shadow .22s ease,background .2s ease,color .2s ease,border-color .2s ease}
.press:active{transform:scale(.955)}
@media(prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

/* ── Top bar: white circles + title + warm avatar ── */
.topbar{display:flex;align-items:center;gap:12px;
  padding:calc(18px + env(safe-area-inset-top)) 20px 12px}
.circ{width:46px;height:46px;border-radius:999px;background:var(--white);border:none;
  display:flex;align-items:center;justify-content:center;color:var(--ink);position:relative;
  box-shadow:var(--sh-circ);flex-shrink:0}
.circ .i{width:19px;height:19px}
.circ .dot{position:absolute;top:2px;right:2px;min-width:17px;height:17px;border-radius:99px;
  background:var(--coral);color:#fff;font-size:9.5px;font-weight:600;display:flex;align-items:center;
  justify-content:center;padding:0 4px}
.tbtitle{flex:1;font-size:16px;font-weight:500}
.ava{width:46px;height:46px;border-radius:999px;flex-shrink:0;position:relative;
  background:radial-gradient(120% 120% at 30% 25%,#FFD9A8 0%,#F4975B 55%,#D96A3B 100%);
  display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:var(--sh-circ)}
.ava .i{width:20px;height:20px}
.ava .dot{position:absolute;top:0;right:0;width:11px;height:11px;border-radius:99px;background:var(--coral);border:2px solid #E4E9F1}

.page{padding:4px 20px 0}
h1.title{font-size:24px;font-weight:600;letter-spacing:-.01em;line-height:1.2;margin:2px 0 2px}
.subtitle{font-size:12.5px;color:var(--sub);margin-bottom:16px}
.subtitle .pos{color:var(--pos);font-weight:600}
.sect{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:24px 2px 12px}
.sect h2{font-size:16.5px;font-weight:600}
.sect .meta{font-size:11.5px;font-weight:500;color:var(--faint)}

/* ── Big amount ── */
.bigamt{display:flex;align-items:baseline;gap:6px;margin:10px 0 2px}
.bigamt .cur{font-size:26px;font-weight:400;color:var(--sub)}
.bigamt .int{font-size:52px;font-weight:300;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.bigamt .dec{font-size:20px;font-weight:400;color:var(--sub);font-variant-numeric:tabular-nums}
.bignote{font-size:12px;color:var(--sub);margin-bottom:16px}
.bignote b{color:var(--pos);font-weight:600}

/* ── White icon chip strip (with red dots) ── */
.chipstrip{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:0 -20px 4px;padding:6px 20px 12px}
.chipstrip::-webkit-scrollbar{display:none}
.qchip{width:54px;height:54px;border-radius:18px;background:var(--white);border:none;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;color:var(--ink);position:relative;box-shadow:var(--sh-circ)}
.qchip .i{width:20px;height:20px}
.qchip .dot{position:absolute;top:-3px;right:-3px;min-width:17px;height:17px;border-radius:99px;
  background:var(--coral);color:#fff;font-size:9.5px;font-weight:600;display:flex;align-items:center;
  justify-content:center;padding:0 4px;border:2px solid #E0E7EF}
.qchip .lbl{position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);font-size:9px;
  font-weight:500;color:var(--sub);white-space:nowrap}
.chipstrip.labeled{padding-bottom:26px}

/* ── Meta columns ── */
.metacols{display:flex;gap:10px;margin:6px 0 16px}
.mcol{flex:1;min-width:0}
.mcol .mk{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:500;color:var(--faint);margin-bottom:3px}
.mcol .mk .i{width:12px;height:12px}
.mcol .mv{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── Signature pill row ── */
.pillrow{display:flex;gap:12px;align-items:stretch}
.vpill{flex:1;border-radius:34px;padding:14px 10px 16px;display:flex;flex-direction:column;
  align-items:center;justify-content:space-between;gap:12px;border:none;min-height:172px;text-align:center}
.vpill .pico{width:40px;height:40px;border-radius:999px;background:rgba(255,255,255,.85);
  display:flex;align-items:center;justify-content:center}
.vpill .pico .i{width:18px;height:18px}
.vpill .pv{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.vpill .pk{font-size:10.5px;font-weight:500;opacity:.75;margin-top:2px}
.vpill.green{background:var(--mint);color:var(--mint-ink)}
.vpill.yellow{background:var(--butter);color:var(--butter-ink)}
.paycard{flex:1.55;background:var(--white);border-radius:26px;padding:16px;box-shadow:var(--sh-card);
  display:flex;flex-direction:column;gap:10px}
.paycard .prow{display:flex;align-items:center;justify-content:space-between}
.paycard .tag{font-size:11px;font-weight:500;background:var(--chipbg);border-radius:99px;padding:5px 11px;color:var(--sub)}
.paycard .dash{border:none;border-top:1.5px dashed var(--line);margin:2px 0}
.paycard .bk{font-size:10.5px;color:var(--faint)}
.paycard .bv{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.blackbtn{background:var(--black);color:var(--on-black);border:none;border-radius:999px;
  padding:13px 20px;font-size:13px;font-weight:500;box-shadow:var(--sh-btn);width:100%}
.blackbtn:hover{background:#26292D}
.blackbtn.sm{padding:10px 16px;font-size:12px;width:auto}

/* ── Pastel cards (learn / tips) ── */
.photorow{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -20px;padding:4px 20px 12px;scroll-snap-type:x mandatory}
.photorow::-webkit-scrollbar{display:none}
.pcard{position:relative;flex:0 0 196px;min-height:124px;border-radius:26px;border:none;text-align:left;
  color:var(--ink);scroll-snap-align:start;box-shadow:var(--sh-card);padding:15px;
  display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start}
.pcard .tico{width:36px;height:36px;border-radius:999px;background:rgba(255,255,255,.9);
  display:flex;align-items:center;justify-content:center}
.pcard .tico .i{width:17px;height:17px}
.pcard .cap .t{font-size:13.5px;font-weight:600;display:block}
.pcard .cap .s{font-size:11px;color:rgba(25,28,31,.62);display:block;margin-top:1px}
.pcard .arr{position:absolute;top:13px;right:13px;width:28px;height:28px;border-radius:999px;
  background:rgba(255,255,255,.7);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.pcard .arr .i{width:13px;height:13px;stroke-width:2.2}
.p-mint{background:var(--mint)}
.p-butter{background:var(--butter)}
.p-lilac{background:var(--lilac)}
.p-coral{background:var(--coral-soft)}
.p-sky{background:var(--sky)}
.p-rose{background:var(--rosec)}

/* ── White sheet + card lists ── */
.sheet{background:var(--sheet);border-radius:28px;padding:6px;box-shadow:var(--sh-card)}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;margin:6px;border-radius:20px;
  background:var(--white);width:calc(100% - 12px);text-align:left;color:var(--ink);border:none;
  transition:background .2s;box-shadow:0 1px 3px rgba(25,28,31,.05),0 6px 14px -8px rgba(25,28,31,.1)}
button.row:hover{background:#FBFCFD}
.sheet .row{box-shadow:none;background:var(--chipbg)}
.sheet button.row:hover{background:#ECEFF2}
.rowico{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  background:var(--white);color:var(--ink);box-shadow:0 1px 3px rgba(25,28,31,.08)}
.sheet .rowico{background:var(--white)}
.rowico.tint{background:var(--mint);color:var(--mint-ink);box-shadow:none}
.rowico .i{width:18px;height:18px}
.row .txt{flex:1;min-width:0}
.row .nm{font-size:13.5px;font-weight:600;display:block}
.row .ds{font-size:11px;color:var(--faint);display:block;margin-top:1px}
.row .amt{font-size:13.5px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.row .amt.dim{color:var(--faint);font-weight:500}
.row .go{width:30px;height:30px;border-radius:999px;background:var(--white);color:var(--ink);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 1px 3px rgba(25,28,31,.08)}
.row .go .i{width:14px;height:14px;stroke-width:2.2}
.row input.nm{border:none;outline:none;background:none;color:var(--ink);width:100%;font-size:13.5px;font-weight:600;padding:2px 0}

.tick{width:24px;height:24px;border-radius:999px;border:1.5px solid var(--disabled);display:flex;align-items:center;
  justify-content:center;flex-shrink:0;color:transparent;background:var(--white);transition:all .2s}
.tick .i{width:13px;height:13px;stroke-width:3}
.tick.on{background:var(--mint);border-color:var(--mint);color:var(--mint-ink)}

/* ── Inputs / chips ── */
.field{display:flex;align-items:center;background:var(--chipbg);border:1.5px solid transparent;
  border-radius:20px;padding:14px 17px;transition:border-color .2s,background .2s}
.field:focus-within{border-color:var(--black);background:var(--white)}
.field .cur{font-size:20px;font-weight:400;color:var(--faint);margin-right:8px}
.field input{background:none;border:none;outline:none;color:var(--ink);font-size:26px;font-weight:300;width:100%;
  font-variant-numeric:tabular-nums}
.field input::placeholder{color:var(--disabled)}
.smallin{border:1.5px solid transparent;border-radius:999px;padding:11px 15px;font-size:12.5px;font-weight:500;
  outline:none;background:var(--chipbg);color:var(--ink);transition:all .2s;min-width:0}
.smallin:focus{border-color:var(--black);background:var(--white)}
.smallin::placeholder{color:var(--disabled)}
.pedit{display:flex;align-items:center;background:var(--white);border-radius:999px;padding:8px 12px;
  border:1.5px solid var(--line)}
.pedit:focus-within{border-color:var(--black)}
.pedit .cur{font-size:11.5px;color:var(--faint);margin-right:2px}
.pedit input{border:none;outline:none;background:none;width:54px;text-align:right;font-size:12.5px;font-weight:600;
  color:var(--ink);font-variant-numeric:tabular-nums}
.rmx{width:32px;height:32px;border-radius:999px;background:var(--white);border:none;color:var(--faint);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s;
  box-shadow:0 1px 3px rgba(25,28,31,.08)}
.rmx:hover{color:var(--neg);background:var(--neg-soft)}
.rmx .i{width:11px;height:11px;stroke-width:2.4}
.addbar{display:flex;gap:8px;padding:10px;align-items:center}
.addbar .grow{flex:1;min-width:0}
.addbar .pr{width:88px}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{background:var(--white);border:none;color:var(--sub);border-radius:999px;
  padding:9px 17px;font-size:12px;font-weight:500;white-space:nowrap;flex-shrink:0;
  box-shadow:var(--sh-circ);transition:all .22s}
.chip:hover{color:var(--ink)}
.chip.on{background:var(--black);color:#fff;font-weight:500}
.searchbar{display:flex;align-items:center;gap:10px;background:var(--white);border:none;
  border-radius:999px;padding:13px 18px;margin-bottom:12px;color:var(--faint);box-shadow:var(--sh-circ)}
.searchbar .i{width:17px;height:17px}
.searchbar input{border:none;outline:none;background:none;font-size:13.5px;flex:1;color:var(--ink)}
.searchbar input::placeholder{color:var(--disabled)}

/* ── Wizard sheet ── */
.wiz{background:var(--white);border-radius:28px;box-shadow:var(--sh-card);overflow:hidden}
.wiz .pad{padding:22px 20px}
.wiz .bar-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.steptag{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.xbtn{width:38px;height:38px;border-radius:999px;background:var(--chipbg);border:none;
  color:var(--ink);display:flex;align-items:center;justify-content:center}
.xbtn:hover{background:var(--line)}
.xbtn .i{width:14px;height:14px;stroke-width:2.2}
.progbar{height:5px;background:var(--chipbg);border-radius:99px;overflow:hidden;margin-bottom:22px}
.progbar i{display:block;height:100%;background:var(--black);border-radius:99px;width:var(--w);
  transition:width .3s cubic-bezier(.25,.6,.3,1)}
.wiz h2.q{font-size:22px;font-weight:600;letter-spacing:-.01em;line-height:1.25;margin-bottom:5px}
.wiz .qs{font-size:12.5px;color:var(--sub);margin-bottom:18px}
.lab{display:block;font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
.quickamts{display:flex;gap:8px;margin:14px 0 14px}
.qa{background:var(--chipbg);border:none;color:var(--sub);border-radius:999px;padding:10px 16px;
  font-size:12.5px;font-weight:500;transition:all .2s}
.qa:hover{background:var(--mint);color:var(--mint-ink)}
.helper{font-size:12px;color:var(--faint);margin-bottom:16px}
.ctarow{display:flex;gap:10px;margin-top:4px;align-items:center}
.backbtn{width:52px;height:52px;border-radius:999px;background:var(--chipbg);border:none;
  color:var(--ink);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.backbtn:hover{background:var(--line)}
.ctarow .blackbtn{flex:1;height:52px}

.ringwrap{display:flex;align-items:center;gap:20px;margin-bottom:16px}
.ring{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:11;stroke-linecap:round}
.ring circle.bgc{stroke:var(--chipbg)}
.ring circle.val{animation:drawRing .8s cubic-bezier(.25,.6,.3,1) both}
.ringcenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringcenter .n{font-size:15px;font-weight:600}
.ringcenter .k{font-size:9px;font-weight:500;color:var(--faint);letter-spacing:.05em;text-transform:uppercase}
.legend{flex:1;min-width:0}
.legend .lg{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:400;color:var(--sub);padding:4px 0;min-width:0}
.legend .lg span.lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend .sw{width:9px;height:9px;border-radius:99px;flex-shrink:0}
.legend .lv{margin-left:auto;font-weight:600;color:var(--ink);padding-left:8px}

.slrow{padding:13px 14px;margin:6px;border-radius:20px;background:var(--chipbg)}
.slrow .t{display:flex;align-items:center;gap:11px;margin-bottom:8px}
.slrow input.nm{border:none;outline:none;background:none;font-size:13.5px;font-weight:600;flex:1;color:var(--ink);min-width:0}
.slrow .pcttag{font-size:12.5px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;min-width:42px;text-align:right}
.slrow input[type=range]{width:100%;accent-color:var(--black);height:26px;cursor:pointer}

/* ── Assistant ── */
.chatpanel{background:var(--white);border-radius:28px;box-shadow:var(--sh-card);overflow:hidden}
.chatbox{display:flex;flex-direction:column;gap:4px;max-height:44vh;overflow-y:auto;padding:16px 14px;scrollbar-width:thin}
.msg{max-width:82%;padding:10px 15px;font-size:13.5px;line-height:1.5;white-space:pre-wrap;
  animation:rise .25s cubic-bezier(.25,.6,.3,1) both;border-radius:20px}
.msg.user{align-self:flex-end;background:var(--black);color:#fff;border-bottom-right-radius:6px;margin-top:8px}
.msg.user+.msg.user{margin-top:2px}
.msg.lisa{align-self:flex-start;background:var(--chipbg);color:var(--ink);border-bottom-left-radius:6px;margin-top:8px}
.msg.lisa+.msg.lisa{margin-top:2px}
.msg.lisa.err{background:var(--neg-soft);color:var(--neg)}
.thinking{display:flex;gap:4px;padding:13px 16px;align-self:flex-start;background:var(--chipbg);
  border-radius:20px;border-bottom-left-radius:6px;margin-top:8px}
.thinking i{width:6px;height:6px;border-radius:99px;background:var(--faint);animation:think 1.2s infinite}
.thinking i:nth-child(2){animation-delay:.2s}
.thinking i:nth-child(3){animation-delay:.4s}
.chatinput{display:flex;gap:8px;align-items:center;padding:10px;border-top:1.5px dashed var(--line)}
.chatinput input{flex:1;background:var(--chipbg);border:1.5px solid transparent;border-radius:999px;outline:none;
  font-size:13.5px;color:var(--ink);padding:12px 18px;min-width:0;transition:all .2s}
.chatinput input:focus{border-color:var(--black);background:var(--white)}
.chatinput input::placeholder{color:var(--disabled)}
.sendbtn{width:44px;height:44px;border-radius:999px;background:var(--black);border:none;color:#fff;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:var(--sh-btn)}
.sendbtn .i{width:16px;height:16px;stroke-width:2.4}

/* Activity-style tip cards */
.tipcard{border-radius:24px;padding:14px 15px;margin-bottom:10px;box-shadow:var(--sh-card);border:none;color:var(--ink)}
.tipcard.c0{background:var(--lilac)}
.tipcard.c1{background:var(--mint)}
.tipcard.c2{background:var(--butter)}
.tipcard.c3{background:var(--coral-soft)}
.tipcard.plain{background:var(--white)}
.tipcard .th{display:flex;align-items:center;gap:11px;margin-bottom:5px}
.tipcard .tico{width:34px;height:34px;border-radius:999px;background:rgba(255,255,255,.9);
  color:var(--ink);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tipcard .tico .i{width:15px;height:15px}
.tipcard .tn{font-size:13.5px;font-weight:600;flex:1;min-width:0}
.tipcard .save{font-size:10.5px;font-weight:600;color:var(--ink);background:rgba(255,255,255,.85);

.tipcard .td{font-size:12.5px;color:rgba(25,28,31,.68);line-height:1.55}
.tipcard .td b{color:var(--ink)}

  animation:shimmer 1.6s linear infinite}

/* ── History ── */
.hrow{padding:13px 15px;margin:6px;border-radius:20px;background:var(--chipbg)}
.hrow .t{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
.hrow .d{font-size:10px;font-weight:600;color:var(--faint);letter-spacing:.06em;text-transform:uppercase}
.hrow .a{font-size:14.5px;font-weight:600;font-variant-numeric:tabular-nums}
.hrow .tags{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:11.5px;color:var(--faint)}
.hrow .tags b{color:var(--sub);font-weight:600;font-variant-numeric:tabular-nums}
.empty{padding:28px 20px;text-align:center}
.empty .ds{font-size:12.5px;color:var(--faint)}
.notice{background:var(--white);border-radius:24px;padding:16px;box-shadow:var(--sh-card)}
.notice .td{font-size:12.5px;color:var(--sub);line-height:1.6}
.notice .td b{color:var(--ink)}
.notice .td b.pos{color:var(--pos)}

/* ── Floating circle nav ── */
.bnav{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:80;
  display:flex;align-items:center;gap:12px}
.bnav button{width:52px;height:52px;border-radius:999px;background:var(--white);border:none;
  display:flex;align-items:center;justify-content:center;color:var(--faint);box-shadow:var(--sh-circ);
  transition:background .25s,color .25s,transform .18s cubic-bezier(.3,1.2,.4,1)}
.bnav button:active{transform:scale(.92)}
.bnav button.on{background:var(--black);color:#fff}
.bnav button.cta{width:58px;height:58px;background:var(--black);color:#fff;box-shadow:var(--sh-btn)}
.bnav button.cta:hover{background:#26292D}
.bnav button .i{width:21px;height:21px}
.bnav button.cta .i{width:23px;height:23px;stroke-width:2.1}

.toastbox{position:fixed;top:calc(16px + env(safe-area-inset-top));left:50%;z-index:99;width:max-content;max-width:88vw;transform:translateX(-50%)}
.toast{background:var(--black);color:#fff;padding:12px 22px;border-radius:999px;font-size:12.5px;
  font-weight:500;box-shadow:var(--sh-btn);animation:popToast .25s cubic-bezier(.25,.6,.3,1) both;
  position:relative;left:50%;transform:translateX(-50%)}
.subtle{font-size:11.5px;color:var(--sub);line-height:1.55}
.btnghost{background:var(--white);color:var(--sub);border:none;border-radius:999px;padding:10px 18px;
  font-size:12px;font-weight:500;box-shadow:var(--sh-circ)}
.btnghost:hover{color:var(--ink)}
.btnghost.danger{color:var(--neg)}
</style>
</head>

const CATICON={"Streaming":"film","Music":"music","Gaming":"game","Fitness":"dumbbell","Software":"cloud","Food":"food","News":"news","Other":"box","Custom":"spark"};
const RULEICONS=["pig","bank","chart","house","star","target","wallet","spark"];
const RULECOLORS=["#118A52","#4A63C9","#0E86A0","#C07716","#7C4FD4","#C43A78","#5A6470","#92400E"];

const CATALOG=[
 ["netflix","Netflix","Streaming",15.49],["hulu","Hulu","Streaming",9.99],["disney","Disney+","Streaming",9.99],
 ["max","Max (HBO)","Streaming",16.99],["prime","Amazon Prime","Streaming",14.99],["appletv","Apple TV+","Streaming",9.99],
 ["peacock","Peacock","Streaming",7.99],["paramount","Paramount+","Streaming",7.99],["crunchy","Crunchyroll","Streaming",7.99],
 ["ytprem","YouTube Premium","Streaming",13.99],["yttv","YouTube TV","Streaming",82.99],["espn","ESPN+","Streaming",11.99],
 ["spotify","Spotify","Music",11.99],["applemusic","Apple Music","Music",10.99],["audible","Audible","Music",14.95],
 ["sirius","SiriusXM","Music",9.99],["tidal","Tidal","Music",10.99],
 ["psplus","PlayStation Plus","Gaming",13.99],["gamepass","Xbox Game Pass","Gaming",16.99],["nso","Nintendo Online","Gaming",3.99],
 ["eaplay","EA Play","Gaming",5.99],["geforce","GeForce NOW","Gaming",9.99],
 ["gym","Gym membership","Fitness",40],["planetfit","Planet Fitness","Fitness",24.99],["equinox","Premium gym","Fitness",200],
 ["peloton","Peloton App","Fitness",12.99],["classpass","ClassPass","Fitness",49],["whoop","WHOOP","Fitness",30],
 ["icloud","iCloud+","Software",2.99],["gone","Google One","Software",2.99],["dropbox","Dropbox","Software",11.99],
 ["m365","Microsoft 365","Software",9.99],["adobe","Adobe CC","Software",59.99],["chatgpt","ChatGPT Plus","Software",20],
 ["claude","Claude Pro","Software",20],["canva","Canva Pro","Software",14.99],["vpn","VPN","Software",12.99],
 ["dashpass","DashPass","Food",9.99],["uberone","Uber One","Food",9.99],["instacart","Instacart+","Food",9.99],
 ["coffee","Coffee habit (avg)","Food",60],
 ["nyt","NY Times","News",6.25],["wsj","Wall Street Journal","News",12.99],["duo","Duolingo Super","News",12.99],
 ["costco","Costco (yr ÷ 12)","Other",5.42],["aaa","AAA (yr ÷ 12)","Other",6],["petins","Pet insurance","Other",35],["storage","Storage unit","Other",120]
].map(([id,name,cat,price])=>({id,name,cat,price}));
const CATS=[...new Set(CATALOG.map(s=>s.cat))];

const DEFAULTS={
  subs:{}, customSubs:[],
  bills:[
    {id:"b1",name:"Student loans",price:300},{id:"b2",name:"Car insurance",price:250},
    {id:"b3",name:"Phone",price:85},{id:"b4",name:"Groceries",price:700},{id:"b5",name:"Gas & tolls",price:250}
  ],
  rules:[
    {id:"savings",name:"Savings / emergency",pct:25,color:"#118A52",icon:"pig"},
    {id:"roth",name:"Roth IRA",pct:12,color:"#4A63C9",icon:"bank"},
    {id:"brokerage",name:"Index funds",pct:25,color:"#0E86A0",icon:"chart"},
    {id:"goal",name:"Big goal",pct:18,color:"#C07716",icon:"house"},
    {id:"fun",name:"Fun money",pct:20,color:"#7C4FD4",icon:"star"}
  ],
  checksPerMonth:2, history:[], totals:{}
};
let D=JSON.parse(JSON.stringify(DEFAULTS));
let screen="home", wizStep=1, preview=null, checkVal="", subSearch="", catFilter="All", ledgerTab="history";
let chat=[], lisaBusy=false, tips=null, tipsBusy=false;

const store={
  async get(k){
    try{if(window.storage){const r=await window.storage.get(k);if(r&&r.value)return r.value;}}catch(e){}
    try{return localStorage.getItem(k);}catch(e){}
    return null;
  },
  async set(k,v){
    try{if(window.storage){await window.storage.set(k,v);return;}}catch(e){}
    try{localStorage.setItem(k,v);}catch(e){}
  }
};
async function load(){
  try{
    const v=await store.get("clearsplit-v6");
    if(v){D=Object.assign(JSON.parse(JSON.stringify(DEFAULTS)),JSON.parse(v));}
  }catch(e){}
  D.rules.forEach((r,i)=>{
    if(!r.icon)r.icon=RULEICONS[i%RULEICONS.length];
    if(!RULECOLORS.includes(r.color))r.color=RULECOLORS[i%RULECOLORS.length];
  });
  render();
}
async function save(){try{await store.set("clearsplit-v6",JSON.stringify(D));}catch(e){}}
function toast(m){
  const t=document.getElementById("toast");
  t.innerHTML='<div class="toast">'+m+'</div>';
  setTimeout(()=>t.innerHTML="",2400);
}
const fmt=n=>n.toLocaleString("en-US",{style:"currency",currency:"USD",maximumFractionDigits:0});
const fmtC=n=>n.toLocaleString("en-US",{style:"currency",currency:"USD",minimumFractionDigits:2,maximumFractionDigits:2});
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const activeSubs=()=>CATALOG.filter(s=>D.subs[s.id]!==undefined).map(s=>({...s,price:D.subs[s.id]})).concat(D.customSubs);
const subsMonthly=()=>activeSubs().reduce((a,s)=>a+s.price,0);
const billsMonthly=()=>D.bills.reduce((a,b)=>a+b.price,0);
const fixedMonthly=()=>subsMonthly()+billsMonthly();
const perCheckFixed=()=>fixedMonthly()/D.checksPerMonth;
const lifetime=()=>Object.values(D.totals).reduce((a,v)=>a+v,0);
const monthPaid=()=>{const m=new Date().toISOString().slice(0,7);return D.history.filter(h=>h.date.startsWith(m)).reduce((a,h)=>a+h.amount,0);};
function bigAmt(n){
  const s=n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
  const[i,d]=s.split(".");
  return '<span class="cur">$</span><span class="int mono">'+i+'</span><span class="dec mono">.'+d+'</span>';
}

function financeContext(){
  return "User's budget data: Bills "+fmt(billsMonthly())+"/mo ("+D.bills.map(b=>b.name+" "+fmt(b.price)).join(", ")+"). "+
  "Subscriptions "+fmt(subsMonthly())+"/mo: "+(activeSubs().map(s=>s.name+" "+fmtC(s.price)).join(", ")||"none tracked yet")+". "+
  "Allocation buckets: "+D.rules.map(r=>r.name+" "+r.pct+"%").join(", ")+". "+
  "Paid "+D.checksPerMonth+"x/month. "+D.history.length+" paychecks logged, "+fmt(lifetime())+" allocated lifetime.";
}

function computeSplit(amt){
  const rows=[];let rem=amt;
  const fixed=Math.min(rem,perCheckFixed());
  rows.push({label:"Bills + subscriptions",amount:fixed,color:"#8A94A0",icon:"receipt",
    note:fmt(billsMonthly())+" bills · "+fmt(subsMonthly())+" subs"});
  rem-=fixed;
  const pool=Math.max(0,amt-perCheckFixed());
  for(const r of D.rules){
    const take=Math.max(0,Math.min(rem,pool*(r.pct/100)));
    if(take>0.005){rows.push({label:r.name,amount:take,color:r.color,icon:r.icon||"wallet",note:r.pct+"% of what's left",ruleId:r.id});rem-=take;}
  }
  if(rem>0.005)rows.push({label:"Unassigned",amount:rem,color:"#B4BCC6",icon:"q",note:"Rules under 100%",ruleId:"unassigned"});
  return rows;
}

async function askClaude(messages){
  let lastErr="";
  for(let attempt=0;attempt<2;attempt++){
    try{
      const res=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({model:"claude-sonnet-4-6",max_tokens:1000,messages})
      });
      const data=await res.json().catch(()=>null);
      if(!res.ok||!data){lastErr=(data&&data.error&&data.error.message)||("HTTP "+res.status);continue;}
      if(data.error){lastErr=data.error.message||"API error";continue;}
      const text=(data.content||[]).filter(b=>b.type==="text").map(b=>b.text).join("\n").trim();
      if(text)return{ok:true,text};
      lastErr="Empty response";
    }catch(e){lastErr=e.message||"Network error";}
  }
  return{ok:false,text:lastErr};
}

window.sendLisa=async(preset)=>{
  if(lisaBusy)return;
  const inp=document.getElementById("lisain");
  const text=preset||(inp?inp.value.trim():"");
  if(!text)return;
  chat.push({role:"user",text});
  lisaBusy=true;render();
  const msgs=[{role:"user",content:
    "You are Lisa, an AI assistant built into ClearSplit, a paycheck-splitting budget app. You are open about being an AI. "+
    "Be warm, plain-spoken (10th-grade level), practical, and concise (under 120 words unless asked for more). Write like a text message — short sentences, no markdown. "+
    "You give general financial education and budgeting help, not professional financial advice; mention that briefly only for major decisions.\n\n"+
    financeContext()+"\n\nConversation so far:\n"+
    chat.slice(0,-1).map(m=>(m.role==="user"?"User: ":"Lisa: ")+m.text).join("\n")+
    "\n\nUser's new message: "+text+"\n\nReply as Lisa:"}];
  const res=await askClaude(msgs);
  if(res.ok){chat.push({role:"lisa",text:res.text});}
  else if(/failed to fetch|networkerror|load failed/i.test(res.text)){
    chat.push({role:"lisa",err:true,text:"I can't reach my AI service from this page. Everything else in the app still works — open ClearSplit inside Claude to chat with me."});}
  else{chat.push({role:"lisa",err:true,text:"Connection hiccup ("+res.text+"). Try me again in a sec."});}
  lisaBusy=false;render();
};

window.genTips=async()=>{
  if(tipsBusy)return;
  tipsBusy=true;tips=null;render();
  const res=await askClaude([{role:"user",content:
    "You are Lisa, an AI assistant in a budgeting app. Based on this user's real data, generate exactly 4 smart, specific ways they could save money. "+
    financeContext()+" "+
    'Respond with ONLY a raw JSON array, no markdown, no backticks: '+
    '[{"title":"short title","detail":"1-2 sentences using their actual numbers","save":"$X/mo"}]'}]);
  if(res.ok){
    try{tips=JSON.parse(res.text.replace(/```json|```/gi,"").trim());}
    catch(e){tips=[{title:"Almost got it",detail:"Lisa answered in the wrong format. Tap Refresh to try again.",save:""}];}
  }else if(/failed to fetch|networkerror|load failed/i.test(res.text)){
    tips=[{title:"Not available on this page",detail:"Lisa can't reach her AI service here. Everything else in the app still works — open ClearSplit inside Claude for AI tips.",save:""}];
  }else{
    tips=[{title:"Connection issue",detail:"Lisa couldn't connect ("+res.text+"). Tap Refresh to retry.",save:""}];
  }
  tipsBusy=false;render();
};

window.go=s=>{screen=s;if(s==="split"){wizStep=1;preview=null;}render();window.scrollTo({top:0});};
window.setAmt=v=>{checkVal=String(v);const el=document.getElementById("checkin");if(el)el.value=v;};
window.wizNext=()=>{
  const el=document.getElementById("checkin");checkVal=el?el.value:checkVal;
  const amt=Number(checkVal);
  if(!amt||amt<=0){toast("Enter your paycheck first");return;}
  preview={amount:amt,rows:computeSplit(amt)};wizStep=2;render();
};
window.wizBack=()=>{wizStep=1;render();};
window.logSplit=async()=>{
  if(!preview)return;
  for(const r of preview.rows){if(r.ruleId)D.totals[r.ruleId]=(D.totals[r.ruleId]||0)+r.amount;}
  D.history.unshift({date:new Date().toISOString().slice(0,10),amount:preview.amount,
    rows:preview.rows.map(r=>({label:r.label,amount:Math.round(r.amount*100)/100}))});
  D.history=D.history.slice(0,100);
  preview=null;checkVal="";wizStep=1;
  await save();go("ledger");toast("Paycheck logged");
};
window.toggleSub=async id=>{
  const s=CATALOG.find(x=>x.id===id);
  if(D.subs[id]!==undefined)delete D.subs[id];else D.subs[id]=s.price;
  await save();render();
};
window.setSubPrice=async(id,v)=>{D.subs[id]=Number(v)||0;await save();};
window.addCustom=async()=>{
  const n=document.getElementById("csName").value,p=Number(document.getElementById("csPrice").value);
  if(!n||!p){toast("Name and price needed");return;}
  D.customSubs.push({id:uid(),name:n,cat:"Custom",price:p});
  await save();render();toast("Added");
};
window.rmCustom=async id=>{D.customSubs=D.customSubs.filter(s=>s.id!==id);await save();render();};
window.setBillName=async(id,v)=>{const b=D.bills.find(x=>x.id===id);if(b)b.name=v;await save();};
window.setBillPrice=async(id,v)=>{const b=D.bills.find(x=>x.id===id);if(b)b.price=Number(v)||0;await save();};
window.addBill=async()=>{
  const n=document.getElementById("nbName").value,p=Number(document.getElementById("nbPrice").value);
  if(!n||!p){toast("Name and price needed");return;}

function donut(rows,total,size){
  const R=(size-13)/2, C=2*Math.PI*R;
  let off=0, segs="";
  rows.forEach((r,i)=>{
    const frac=r.amount/total, len=frac*C;
    segs+='<circle class="val" cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+R+'" stroke="'+r.color+'" '+
      'stroke-dasharray="'+Math.max(0,len-3)+' '+(C-len+3)+'" stroke-dashoffset="'+(-off)+'" style="--c:'+C+';animation-delay:'+(0.1+i*0.05)+'s"/>';
    off+=len;
  });
  return '<div style="position:relative;width:'+size+'px;height:'+size+'px;flex-shrink:0">'+
    '<svg class="ring" width="'+size+'" height="'+size+'" role="img" aria-label="Allocation breakdown">'+
    '<circle class="bgc" cx="'+(size/2)+'" cy="'+(size/2)+'" r="'+R+'"/>'+segs+'</svg>'+
    '<div class="ringcenter"><div class="n mono">'+fmt(total)+'</div><div class="k">this check</div></div></div>';
}

function countUp(){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  document.querySelectorAll('[data-count]').forEach(el=>{
    const to=Number(el.dataset.count);
    if(!to)return;
    const t0=performance.now(),dur=750;
    const step=t=>{
      const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3);
      el.innerHTML=bigAmt(to*e);
      if(p<1)requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}
